<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="そらのみなと">
<meta name="theme-color" content="#0f1c2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<title>そらのみなと 試作</title>
<style>
:root{
  /* 空港の案内サインから取った配色 */
  --l0:#1b2129;            /* 地 */
  --l1:#232b35;            /* 板・行 */
  --l2:#2b3540;            /* 自作アイコン（12×12ドットを整数倍で表示） */
.pi{display:block;width:24px;height:24px;image-rendering:pixelated;flex:none}
.pi.s{display:inline-block;width:12px;height:12px;vertical-align:-1px}
.pi.big{width:48px;height:48px}
.row .ic .pi{margin:0 auto}
.close .pi{width:18px;height:18px;margin:auto}
#toast{display:flex;align-items:center;gap:8px}
#toast .pi{width:24px;height:24px}


/* 設計（平面図） */
.seg{display:flex;border:1px solid var(--edge2);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:40px;font-size:var(--small);font-weight:500;color:var(--muted)}
.seg button.on{background:var(--sign);color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tools button{height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--edge2);font-size:var(--small);display:flex;align-items:center;gap:6px;color:var(--text)}
.tools button.on{border-color:var(--sign);box-shadow:inset 0 0 0 1px var(--sign);color:var(--sign)}
.tools i,.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.plan{display:grid;gap:3px;margin-top:12px;padding:6px;background:#141a21;border-radius:12px;border:1px solid var(--edge)}
.plan .apron{font-size:var(--meta);color:var(--muted);text-align:center;padding:2px 0;border-bottom:2px dashed #3a4450}
.pc{position:relative;aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:var(--meta);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pc img{width:88%;height:88%;object-fit:contain;image-rendering:pixelated}
.pc img.pi{width:24px;height:24px}
.pc b{position:absolute;left:0;right:0;top:0;height:4px}
.pc.idle{box-shadow:inset 0 0 0 3px var(--ng)}
.curb{margin-top:4px;text-align:center;font-size:var(--meta);color:var(--muted);padding:4px;border-top:2px solid #6d737b}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:var(--meta);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
input[type=range]{width:100%;margin-top:8px;accent-color:var(--sign)}
#floorBtn{font-size:var(--small);font-weight:600;color:var(--sign)}

/* シート */
  --edge:rgba(255,255,255,.09);
  --edge2:rgba(255,255,255,.16);
  --text:#edf1f5; --muted:#9aa7b4;
  --sign:#ffcd1c;          /* 操作できるもの・お金（唯一のアクセント） */
  --ink:#1b1600;           /* サイン黄の上の文字 */
  --ok:#5cc98b; --late:#f2a33a; --ng:#f06464;   /* 定刻・遅れ・欠航 */
  --meta:.75rem; --small:.875rem; --body:1rem; --h2:1.25rem; --h1:1.5rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--l0);color:var(--text);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-weight:400;line-height:1.5;overscroll-behavior:none}
body{overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 地図は画面いっぱい。情報は上下に半透明で重ねる */
#cv{position:fixed;inset:0;display:block;touch-action:none;background:#4a7838}
.glass{background:rgba(20,26,34,.84);border:1px solid var(--edge);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.topbar{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);width:calc(100% - 12px);max-width:560px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.topbar > *{pointer-events:auto}
.bottombar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);width:calc(100% - 12px);max-width:560px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bottombar > *{pointer-events:auto}

/* ヘッダー：お金 > 時刻 > 評判 の順に目立たせる */
.hud{border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.hud-main,.hud-sub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.money{font-size:var(--h2);font-weight:600;line-height:1.2;color:var(--sign);font-variant-numeric:tabular-nums}
.money.neg{color:var(--ng)}
.clock{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.clock span{font-size:var(--small);color:var(--muted)}
.clock b{font-size:var(--h2);font-weight:500;line-height:1.2}
.status{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:var(--small);white-space:nowrap;overflow:hidden}
.rep{color:var(--sign);letter-spacing:1px}
.rep .dim{color:#4a5562}
.rank{color:var(--text);font-weight:500}
.event{color:var(--late)}
.speed{display:flex;flex:none;border:1px solid var(--edge);border-radius:9px;overflow:hidden;background:var(--l1)}
.speed button{width:42px;height:32px;font-size:var(--meta);font-weight:500;color:var(--muted);border-left:1px solid var(--edge)}
.speed button:first-child{border-left:0}
.speed button.on{background:var(--sign);color:var(--ink)}

/* 発着案内（1行） */
.board{border-radius:10px;overflow:hidden;display:block;width:100%;text-align:left}
.fl{display:grid;grid-template-columns:3.2em 1fr auto auto;align-items:center;gap:8px;padding:6px 10px;font-size:var(--small);line-height:1.4}
.fl time{font-variant-numeric:tabular-nums;color:var(--sign);font-weight:500}
.fl .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .who i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.fl .who small{color:var(--muted);font-size:var(--meta);margin-left:6px}
.fl .cnt{color:var(--muted);font-size:var(--meta);font-variant-numeric:tabular-nums}
.chip{font-size:var(--meta);font-weight:500;padding:1px 8px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.late{color:var(--late)} .chip.ng{color:var(--ng);background:rgba(240,100,100,.12)} .chip.mute{color:var(--muted)}

/* 拡大縮小 */
.zoom{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.zoom button{width:44px;height:44px;font-size:20px;color:var(--text);border-top:1px solid var(--edge)}
.zoom button:first-child{border-top:0}

/* アドバイザー：次にやること */
.advisor{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  border-left:4px solid var(--edge2);border-radius:10px;font-size:var(--small);line-height:1.45}
.advisor.warn{border-left-color:var(--late)} .advisor.ng{border-left-color:var(--ng)} .advisor.tip{border-left-color:var(--sign)}
.advisor .go{margin-left:auto;color:var(--sign);font-weight:500;white-space:nowrap}

.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:12px;overflow:hidden}
.bar button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--meta);font-weight:500;color:var(--muted);gap:2px;position:relative;border-left:1px solid var(--edge)}
.bar button:first-child{border-left:0}
.bar button .pi{width:24px;height:24px}
.bar .dot{position:absolute;top:7px;right:calc(50% - 22px);min-width:8px;height:8px;border-radius:4px;background:var(--sign);display:none}
.bar .dot.on{display:block}
@media (orientation:landscape) and (max-height:500px){
  .topbar{flex-direction:row;max-width:none;align-items:stretch} .topbar .hud{flex:1} .topbar .board{flex:1;align-self:flex-start}
  .bottombar{flex-direction:row;max-width:none;align-items:stretch} .bottombar .advisor{flex:1} .bottombar .bar{width:280px}
  .bar button{height:44px}
}


/* 設計（平面図） */
.seg{display:flex;border:1px solid var(--edge2);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:40px;font-size:var(--small);font-weight:500;color:var(--muted)}
.seg button.on{background:var(--sign);color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tools button{height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--edge2);font-size:var(--small);display:flex;align-items:center;gap:6px;color:var(--text)}
.tools button.on{border-color:var(--sign);box-shadow:inset 0 0 0 1px var(--sign);color:var(--sign)}
.tools i,.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.plan{display:grid;gap:3px;margin-top:12px;padding:6px;background:#141a21;border-radius:12px;border:1px solid var(--edge)}
.plan .apron{font-size:var(--meta);color:var(--muted);text-align:center;padding:2px 0;border-bottom:2px dashed #3a4450}
.pc{position:relative;aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:var(--meta);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pc img{width:88%;height:88%;object-fit:contain;image-rendering:pixelated}
.pc img.pi{width:24px;height:24px}
.pc b{position:absolute;left:0;right:0;top:0;height:4px}
.pc.idle{box-shadow:inset 0 0 0 3px var(--ng)}
.curb{margin-top:4px;text-align:center;font-size:var(--meta);color:var(--muted);padding:4px;border-top:2px solid #6d737b}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:var(--meta);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
input[type=range]{width:100%;margin-top:8px;accent-color:var(--sign)}
#floorBtn{font-size:var(--small);font-weight:600;color:var(--sign)}

/* シート */
.sheet{position:fixed;inset:0;background:rgba(6,9,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet.hidden{display:none}
.sheet-inner{width:100%;max-width:480px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--l2);
  border:1px solid var(--edge);border-bottom:0;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.sheet h2{margin:0;font-size:var(--h2);font-weight:600;line-height:1.25}
.sheet h3{margin:20px 0 8px;font-size:var(--small);color:var(--muted);font-weight:500}
.sheet p{margin:8px 0 0;font-size:var(--small);line-height:1.55;color:var(--muted)}
.sheet p.lead{font-size:var(--body);color:var(--text)}
.top{display:flex;align-items:flex-start;gap:12px}
.top .big{flex:none;font-size:32px;line-height:1}
.top > div{flex:1;min-width:0}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:2px}
.pips i{width:8px;height:8px;border-radius:50%;border:1px solid var(--sign)}
.pips i.on{background:var(--sign)}
.ok{color:var(--ok)} .ng{color:var(--ng)} .late{color:var(--late)} .muted{color:var(--muted)} .signc{color:var(--sign)}

.list{background:var(--l1);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--edge)}
.row:first-child{border-top:0}
.row .ic{font-size:24px;width:44px;text-align:center;flex:none}
.pix{display:block;width:44px;height:40px;object-fit:contain;image-rendering:pixelated}
.pix.big{width:64px;height:60px}
.row .bd{flex:1;min-width:0;font-size:var(--small);line-height:1.45;color:var(--muted)}
.row .bd b{display:block;font-size:var(--body);font-weight:500;color:var(--text)}
.row .fx{display:inline-block;margin-top:4px;font-size:var(--meta);font-weight:500;padding:1px 8px;border-radius:6px}
.row .fx.ok{background:rgba(92,201,139,.14)} .row .fx.ng{background:rgba(240,100,100,.14)}
.row.off .ic,.row.off b{opacity:.5}

.btn{min-width:76px;height:40px;padding:0 12px;border-radius:10px;background:var(--sign);color:var(--ink);font-weight:500;font-size:var(--small);flex:none;font-variant-numeric:tabular-nums}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--edge2)}
.btn.price{background:rgba(255,205,28,.08);color:var(--sign);border:1px solid rgba(255,205,28,.45)}
.btn:disabled{background:transparent;color:var(--muted);border:1px solid var(--edge)}
.btn.wide{width:100%;height:48px;margin-top:16px;font-size:var(--body)}
.textbtn{display:block;margin:16px auto 0;padding:10px 16px;color:var(--ng);font-size:var(--small)}

.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.stat > div{background:var(--l1);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
.stat > div > small{display:block;font-size:var(--meta);color:var(--muted)}
.stat b small{font-size:var(--small);font-weight:400;color:var(--muted);margin-left:2px}
.stat b{font-size:var(--h2);font-weight:500;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:var(--small);background:var(--l1);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.tbl td{padding:8px 12px;border-top:1px solid var(--edge);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl small{display:block;color:var(--muted);font-size:var(--meta)}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.close{float:right;font-size:20px;color:var(--muted);width:44px;height:44px;margin:-10px -10px 0 8px}
details.locked{margin-top:12px;font-size:var(--small);color:var(--muted)}
details.locked summary{padding:10px 0;cursor:pointer}
details.locked .row{opacity:.6}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);transform:translateX(-50%);background:var(--l2);
  border:1px solid var(--edge2);padding:8px 14px;border-radius:10px;font-size:var(--small);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.top{bottom:auto;top:calc(env(safe-area-inset-top) + 120px)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="空港の地図（ドラッグで移動・2本指で拡大）"></canvas>
<div class="topbar">
<header class="hud glass">
  <div class="hud-main">
    <div class="money" id="money">¥0</div>
    <div class="clock"><span id="day">1日目</span><b id="time">06:00</b></div>
  </div>
  <div class="hud-sub">
    <div class="status"><span class="rep" id="rep"></span><span class="rank" id="rank"></span><span class="event" id="event"></span></div>
    <div class="speed" id="speed" role="group" aria-label="時間の速さ">
      <button data-sp="0" aria-label="一時停止">停止</button><button data-sp="1" class="on" aria-label="等速">×1</button><button data-sp="2" aria-label="2倍速">×2</button><button data-sp="4" aria-label="4倍速">×4</button>
    </div>
  </div>
</header>
<button class="board glass" id="board" aria-label="発着案内（タップで一覧）" aria-live="polite"></button>
</div>
<div class="zoom glass" role="group" aria-label="地図の大きさ"><button id="floorBtn">2F</button><button data-z="1" aria-label="拡大">＋</button><button data-z="-1" aria-label="縮小">－</button></div>
<div class="bottombar">
<button class="advisor glass" id="advisor"></button>
<nav class="bar glass">
  <button data-open="design"><img class="pi" data-pi="plan" alt="">設計</button>
  <button data-open="air"><img class="pi" data-pi="plane" alt="">航空会社<i class="dot" id="dotAir"></i></button>
  <button data-open="goal"><img class="pi" data-pi="flag" alt="">目標</button>
  <button data-open="today"><img class="pi" data-pi="chart" alt="">きょう</button>
  <button data-open="menu"><img class="pi" data-pi="gear" alt="">設定</button>
</nav>
</div>
<div class="sheet hidden" id="sheet"><div class="sheet-inner" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
'use strict';
// ============ 基本 ============
const APP_VERSION = '0.7.1';   // sw.js の VERSION と同じ値にする
const SAVE_KEY = 'soranominato-v1';
const COLS = 8, TROWS = 6, FLOORS = 2;   // 階：0 = 1階（到着）、1 = 2階（出発）
const DAY_LEN = 1080;          // 06:00〜24:00（分）
const MS_PER_MIN = 120;        // 等速で 1ゲーム分 = 0.12秒（1日 約2分10秒）
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const num = n => Math.round(n).toLocaleString('ja-JP');
const hhmm = t => { const m = Math.floor(t) + 360; return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// ============ ターミナルの構造 ============
// 区画はマスごとに自分で決める。2階の空港側の列（行0）はゲート待合室で固定。
//   p 一般エリア：車寄せから入る。チェックイン・見送り
//   s 保安検査：保安検査レーンを置く。一般 → レーン → 出発エリア の向きにだけ通れる
//   d 出発エリア：保安検査の後。お店・ラウンジ。一般エリアへは戻れない
//   a 到着エリア：手荷物受取場。ここから一般エリアへ出られる
//   g ゲート待合室（固定）
const ZONES = {
  p: { name: '一般エリア', short: '一般', color: '#d8d2c4', ink: '#1b2129', hint: '車寄せから入った出発客がチェックインします。到着客と見送りの人も通ります。' },
  s: { name: '保安検査', short: '保安検査', color: '#e9c440', ink: '#1b2129', hint: '保安検査レーンと出入国審査を置く区画。一般エリアと出発エリアの間に置きます。レーンのないマスは通れません。' },
  d: { name: '出発エリア', short: '出発', color: '#7fb3e6', ink: '#1b2129', hint: '保安検査を通った出発客だけが来ます。ゆっくり過ごすのでお店の売上が3割多くなります。' },
  a: { name: '到着エリア', short: '到着', color: '#7cc79a', ink: '#1b2129', hint: '飛行機を降りた客が通り、手荷物受取場で荷物を受け取って一般エリアへ出ます。' },
  g: { name: 'ゲート待合室', short: 'ゲート', color: '#4a5a7c', ink: '#ffffff', hint: '' },
};
const FLOOR_NAME = ['1階（到着）', '2階（出発）'];
const WING_COST = [0, 12000, 50000], WING_RANK = [0, 2, 3];
const colRange = () => [2 - S.wings, 5 + S.wings];
const isOpen = c => { const [a, b] = colRange(); return c >= a && c <= b; };
const zoneAt = (f, r, c) => (f === 1 && r === 0) ? 'g' : S.zn[f][idx(r, c)];
const cellAt = (f, r, c) => S.fl[f][idx(r, c)];
function defaultZones() {
  const z = [Array(COLS * TROWS).fill('p'), Array(COLS * TROWS).fill('p')];
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < 3; r++) z[0][idx(r, c)] = 'a';
    z[1][idx(0, c)] = 'd'; z[1][idx(1, c)] = 'd'; z[1][idx(2, c)] = 's';
  }
  return z;

function migrateOld(d) {   // 旧版から：建物の代金を全額返して、新しい2階建てターミナルに引き継ぐ
  const OLD_COST = { counter: 300 };
  let back = 0;
  for (const b of d.grid || []) if (b) {
    const base = FAC[b.k]?.cost ?? OLD_COST[b.k] ?? 0;
    back += base; for (let l = 2; l <= (b.lv || 1); l++) back += base * LV_COST[l];
  }
  newGame();
  const used = (d.gates || []).map((g, i) => g ? i : -1).filter(i => i >= 0);
  const need = used.length ? Math.max(2 - Math.min(...used), Math.max(...used) - 5, 0) : 0;
  Object.assign(S, {
    money: (d.money || 0) + back, day: d.day || 1, rep: d.rep ?? 30, rank: d.rank || 1, runway: d.runway || 1,
    contracts: d.contracts || S.contracts, offers: d.offers || S.offers, missions: d.missions || {}, totals: d.totals || S.totals,
    seenHelp: d.seenHelp, cid: d.cid || S.cid, fid: d.fid || S.fid, last: d.last || null, rec: d.rec || [],
    wings: Math.max(d.wings || 0, Math.min(2, need)), sites: d.sites || S.sites,
  });
  if (used.length) S.gates = d.gates.slice(0, COLS);
  placeStarter();
  S.dayOver = false; S.t = 0;
  recalc(); scheduleDay(0); migrated = true;
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d) return false;
    if (d.v === 1 || d.v === 2) { migrateOld(d); save(); return true; }
    if (d.v !== 3) return false;
    S = d; S.gh ??= 0; S.clearDay ??= 0; recalc(); return true;
  } catch (e) { return false; }
}

// ============ 計算 ============
function cnt(k) { return C.counts?.[k] || 0; }
function gateCount() { return S.gates.filter(g => g > 0).length; }
function idx(r, c) { return r * COLS + c; }
function neighbors(f, r, c) {   // 同じ階・同じ区画の隣
  const out = [], z = zoneAt(f, r, c);
  for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= TROWS || !isOpen(nc) || zoneAt(f, nr, nc) !== z) continue;
    out.push([nr, nc]);
  }
  return out;
}
function adjInfo(f, r, c, k) {
  const fa = FAC[k]; let m = 0; const parts = [];
  if (fa.adj) for (const [nr, nc] of neighbors(f, r, c)) {
    const n = cellAt(f, nr, nc);
    if (n && fa.adj[n.k] != null) { m += fa.adj[n.k]; parts.push([FAC[n.k].name, fa.adj[n.k]]); }
  }
  m = clamp(m, -.3, .5);
  return { mul: 1 + m, parts };
}
function airlineColor(name) { return S.contracts.find(c => c.name === name)?.color || [...AIRLINES, ...INTL].find(a => a[0] === name)?.[1] || '#5d6b7a'; }
// ---- つながりの点検（幅優先探索）。node = [階, 行, 列]
const nkey = (f, r, c) => (f * TROWS + r) * COLS + c;
function walkable(f, r, c) { const b = cellAt(f, r, c); return !(b && b.k === 'plant'); }
function bfs(starts, allow) {
  const seen = new Map(), q = [];
  for (const s of starts) if (allow(...s, null)) { seen.set(nkey(...s), null); q.push(s); }
  while (q.length) {
    const [f, r, c] = q.shift(), here = cellAt(f, r, c);
    const nexts = [[f, r + 1, c], [f, r - 1, c], [f, r, c + 1], [f, r, c - 1]];
    if (here && here.k === 'stairs') nexts.push([1 - f, r, c]);
    for (const n of nexts) {
      const [nf, nr, nc] = n;
      if (nr < 0 || nr >= TROWS || !isOpen(nc) || seen.has(nkey(nf, nr, nc))) continue;
      if (!allow(nf, nr, nc, [f, r, c])) continue;
      seen.set(nkey(nf, nr, nc), [f, r, c]); q.push(n);
    }
  }
  return seen;
}
function pathTo(seen, goal) { if (!seen.has(nkey(...goal))) return null; const out = []; let cur = goal; while (cur) { out.unshift(cur); cur = seen.get(nkey(...cur)); } return out; }

  h += `<div class="stat"><div><small>収支</small><b class="${net >= 0 ? 'ok' : 'ng'}">${net >= 0 ? '+' : ''}${yen(net)}</b></div><div><small>旅客</small><b>${num(D.pax)}<small>人</small></b></div></div>
    <h3>内わけ</h3><table class="tbl">
    <tr><td>着陸料</td><td>+${yen(D.fees)}</td></tr><tr><td>お店・駐車場</td><td>+${yen(D.shop)}</td></tr>
    <tr><td>カウンター賃料</td><td>+${yen(D.rent)}</td></tr>
    <tr><td>維持費</td><td class="ng">−${yen(D.upkeep)}</td></tr>
    <tr><td>着陸した便</td><td>${D.flights}便<small>定時 ${D.ontime}</small></td></tr>
    <tr><td>欠航</td><td class="${D.cancels ? 'ng' : ''}">${D.cancels}便</td></tr>
    <tr><td>評判</td><td>${ic('star', 'sign', 's')} ${(S.rep / 20).toFixed(1)}</td></tr></table>`;
  if (S.nextEvent) h += `<p class="late">あしたの予報：${EVENTS[S.nextEvent].name}（${EVENTS[S.nextEvent].desc}）</p>`;
  h += `<p>航空会社から新しい契約の話が${S.offers.length}件届いています。</p>`;
  h += `<button class="btn wide" data-act="next">${S.day + 1}日目をはじめる</button>`;
  openSheet(h);
}
function openMenu() {
  openSheet(`${X}<h2>設定</h2>
    <div class="list" style="margin-top:12px">
    <div class="row"><div class="ic">${ic('battery', 'muted')}</div><div class="bd"><b>省電力モード</b>描画を減らし、売上の数字を出しません</div>
      <button class="btn ${lowPower ? '' : 'ghost'}" data-act="power">${lowPower ? 'オン' : 'オフ'}</button></div>
    <div class="row"><div class="ic">${ic('help', 'muted')}</div><div class="bd"><b>遊び方</b></div><button class="btn ghost" data-act="help">見る</button></div></div>
    <h3>音</h3><div class="list">
    <div class="row"><div class="ic">${ic('note', 'muted')}</div><div class="bd"><b>音を鳴らす</b>iPhone のマナーモード中は鳴りません</div><button class="btn ${SND.on ? '' : 'ghost'}" data-act="snd">${SND.on ? 'オン' : 'オフ'}</button></div>
    <div class="row"><div class="bd"><b>BGM</b><input type="range" min="0" max="100" value="${Math.round(SND.bgm * 100)}" data-vol="bgm" aria-label="BGMの音量"></div></div>
    <div class="row"><div class="bd"><b>効果音</b><input type="range" min="0" max="100" value="${Math.round(SND.sfx * 100)}" data-vol="sfx" aria-label="効果音の音量"></div></div></div>
    <h3>バージョン</h3><p><b>${APP_VERSION}</b></p><p id="newver" hidden></p>
    <h3>オフライン</h3><p id="offline">確認中…</p>
    <h3>記録</h3><table class="tbl"><tr><td>のべ旅客</td><td>${num(S.totals.pax)}人</td></tr><tr><td>のべ便数</td><td>${num(S.totals.flights)}便</td></tr></table>
    <p>セーブは1時間ごと・建てたとき・アプリを閉じたときに自動で行います。</p>
    <button class="textbtn" data-act="reset">最初からやり直す</button>`);
  offlineStatus().then(([t, c]) => { const el = $('#offline'); if (el) { el.textContent = t; el.className = c; } });
  readyVersion().then(v => { const el = $('#newver'); if (el && v) { el.textContent = `新しい版 ${v} を受け取りました。アプリを閉じてもう一度開くと切り替わります。`; el.className = 'late'; el.hidden = false; } });
}
async function readyVersion() {   // 受け取り済みで、まだ動いていない新しい版
  try {
    const v = (await caches.keys()).filter(k => k.startsWith('soranominato-')).map(k => k.slice(13)).pop();
    return v && v !== APP_VERSION ? v : '';
  } catch (e) { return ''; }
}
async function offlineStatus() {
  if (!('serviceWorker' in navigator)) return ['このブラウザはオフライン起動に対応していません。', 'ng'];
  if (!window.isSecureContext) return ['無効：https のページ（GitHub Pages など）からホーム画面に追加したときだけ、機内モードで起動できます。', 'ng'];
  let ok = false;
  try { ok = !!navigator.serviceWorker.controller && (await caches.keys()).some(k => k.startsWith('soranominato-')); } catch (e) {}
  return ok ? ['有効：機内モードでも起動できます。', 'ok'] : ['準備中：一度閉じて、もう一度開くと有効になります。', 'late'];
}
function openHelp() {
  S.seenHelp = true; save();
  openSheet(`${X}<h2>そらのみなと</h2>
    <p class="lead">小さな地方空港を、世界一の空港に育てましょう。</p>
    <h3>2階建てのターミナル</h3>
    <p><b>2階（出発）</b>：高架道路の車寄せ → 一般エリアのチェックイン → 保安検査レーン → 出発エリア（お店）→ ゲート待合室 → 搭乗橋<br>
    <b>1階（到着）</b>：飛行機を降りた客はエスカレーターで1階へ → 到着エリアの手荷物受取場 → 一般エリア → 地上の車寄せ・駅・駐車場<br>
    地図の右の「2F／1F」で表示する階を切り替えます。</p>
    <h3>設計</h3>
    <p>下の「設計」で平面図を開き、マスを「一般・保安検査・出発・到着」に塗り分けて、建物やエスカレーターを置きます。区画の境目にはガラスの仕切りが立ち、保安検査レーンのある所だけ通れます。平面図の下の「流れの点検」で、出発と到着の道がつながっているか確かめられます。</p>
    <h3>気をつけること</h3>
    <p>航空会社ごとにチェックインカウンターが必要です（共用カウンターでも可）。道がつながっていない建物は使われません（赤い枠）。チェックイン・保安検査・手荷物受取のどこかが足りないと行列ができ、評判も買い物も減ります。ゲートが空いていないと飛行機は上空で待ち、90分で欠航します。</p>
    <h3>操作</h3>
    <p>ドラッグで地図を動かし、2本指で拡大縮小。マスをタップして建てる。ゲート・滑走路・駐車場などの予定地もタップできます。画面下の欄には、いまやるとよいことが出ます。</p>
    <button class="btn wide" data-act="close">はじめる</button>`);
}

// ============ 入力 ============

$('#speed').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  speed = +b.dataset.sp; if (speed) lastSpeed = speed;
  for (const x of $('#speed').children) x.classList.toggle('on', x === b);
  requestDraw();
});
document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (!b || S.dayOver) return;
  ({ design: () => openDesign(viewFloor), air: openAir, goal: openGoal, today: openToday, menu: openMenu })[b.dataset.open]();
  updateHud();
});
let toastTimer = 0;
function toast(msg, icon) {
  const el = $('#toast'); el.innerHTML = (icon ? ic(icon) : '') + `<span>${msg}</span>`; el.classList.toggle('top', sheetOpen()); el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2800);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); }
  else { lastFrame = 0; requestDraw(); }
});
window.addEventListener('resize', () => { layout(); requestDraw(); });
$('#board').addEventListener('click', () => { if (!S.dayOver) openToday(); });
document.querySelector('.zoom').addEventListener('click', e => { if (e.target.closest('#floorBtn')) { viewFloor = 1 - viewFloor; updateFloorBtn(); sfx('click'); requestDraw(); return; } const b = e.target.closest('[data-z]'); if (b) zoomAt(VW / 2, VH / 2, cam.n + +b.dataset.z); });
window.addEventListener('pagehide', save);

// ============ 起動 ============
for (const im of document.querySelectorAll('[data-pi]')) im.src = pictoURL(im.dataset.pi, ICOL.muted);
try { lowPower = localStorage.getItem(SAVE_KEY + '-lp') === '1'; } catch (e) {}
if (!load()) newGame();
updateHud(); updateFloorBtn(); layout(); requestDraw();
if (migrated) setTimeout(() => toast('新しいターミナルに建て替えました。建物の代金は全額返しています'), 800);
if (S.dayOver) openReport(null);
else if (!S.seenHelp) openHelp();
// 開発中（localhost）は古い版が残らないよう service worker を使わない（?sw を付けると使う）
const DEV = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !location.search.includes('sw');
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !DEV) navigator.serviceWorker.register('sw.js').catch(() => {});

// デバッグ用
window.T = {
  get S() { return S; }, C: () => C, step(n = 60) { for (let i = 0; i < n && !S.dayOver; i++) stepMinute(); requestDraw(); updateHud(); },
  day() { while (!S.dayOver) stepMinute(); updateHud(); }, startDay, build, acceptOffer, upgradeGate, newGame, recalc,
  api: { get C() { return C; }, FAC, colRange, zoneAt, cellAt, canBuildAt, isOpen, paintZone, WING_RANK, WING_COST, buildWing, buildSite, closeSheet, RUNWAY, GH, GATE_COST, GATE_RANK, upgradeRunway, upgradeGH, levelUp, LV_COST, dropContract },
};
</script>
