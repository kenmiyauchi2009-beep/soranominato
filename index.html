<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="そらのみなと">
<meta name="theme-color" content="#0f1c2b">
<link rel="manifest" href="manifest.webmanifest">
<title>そらのみなと 試作</title>
<style>
:root{
  /* 空港の案内サインから取った配色 */
  --l0:#1b2129;            /* 地 */
  --l1:#232b35;            /* 板・行 */
  --l2:#2b3540;            /* シート */
  --edge:rgba(255,255,255,.09);
  --edge2:rgba(255,255,255,.16);
  --text:#edf1f5; --muted:#9aa7b4;
  --sign:#ffcd1c;          /* 操作できるもの・お金（唯一のアクセント） */
  --ink:#1b1600;           /* サイン黄の上の文字 */
  --ok:#5cc98b; --late:#f2a33a; --ng:#f06464;   /* 定刻・遅れ・欠航 */
  --meta:.75rem; --small:.875rem; --body:1rem; --h2:1.25rem; --h1:1.5rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--l0);color:var(--text);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-weight:400;line-height:1.5;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ヘッダー：お金 > 時刻 > 評判 の順に目立たせる */
.hud{width:100%;max-width:460px;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.hud-main,.hud-sub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.money{font-size:var(--h1);font-weight:600;line-height:1.15;color:var(--sign);font-variant-numeric:tabular-nums}
.money.neg{color:var(--ng)}
.clock{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.clock span{font-size:var(--small);color:var(--muted)}
.clock b{font-size:var(--h2);font-weight:500;line-height:1.15}
.status{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:var(--small);white-space:nowrap;overflow:hidden}
.rep{color:var(--sign);letter-spacing:1px}
.rep .dim{color:#4a5562}
.rank{color:var(--text);font-weight:500}
.event{color:var(--late)}
.speed{display:flex;flex:none;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--l1)}
.speed button{width:44px;height:36px;font-size:var(--meta);font-weight:500;color:var(--muted);border-left:1px solid var(--edge)}
.speed button:first-child{border-left:0}
.speed button.on{background:var(--sign);color:var(--ink)}

/* 発着案内ボード（この画面でいちばん目立つもの） */
.board{width:100%;max-width:460px;background:#10151b;border:1px solid var(--edge);border-radius:10px;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.board .hd{display:flex;justify-content:space-between;padding:4px 10px;font-size:var(--meta);color:var(--muted);border-bottom:1px solid var(--edge)}
.fl{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:8px;padding:4px 10px;font-size:var(--small);line-height:1.4;border-top:1px solid rgba(255,255,255,.05)}
.fl:first-of-type{border-top:0}
.fl time{font-variant-numeric:tabular-nums;color:var(--sign);font-weight:500}
.fl .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .who i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.fl .who small{color:var(--muted);font-size:var(--meta);margin-left:6px}
.chip{font-size:var(--meta);font-weight:500;padding:1px 8px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.late{color:var(--late)} .chip.ng{color:var(--ng);background:rgba(240,100,100,.12)} .chip.mute{color:var(--muted)}
.board .empty{padding:8px 10px;font-size:var(--small);color:var(--muted)}
@media (max-height:700px){ .fl:nth-of-type(n+3){display:none} }
.hud,.board,#cv,.advisor,.bar{flex:none}

#cv{display:block;border-radius:10px;touch-action:manipulation}

/* アドバイザー：次にやること */
.advisor{width:100%;max-width:460px;min-height:44px;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  background:var(--l1);border:1px solid var(--edge);border-left:4px solid var(--edge2);border-radius:10px;font-size:var(--small);line-height:1.45}
.advisor.warn{border-left-color:var(--late)} .advisor.ng{border-left-color:var(--ng)} .advisor.tip{border-left-color:var(--sign)}
.advisor .go{margin-left:auto;color:var(--sign);font-weight:500;white-space:nowrap}

.bar{width:100%;max-width:460px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:auto}
.bar button{height:56px;border-radius:12px;background:var(--l1);border:1px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--meta);font-weight:500;color:var(--muted);gap:2px;position:relative}
.bar button span{font-size:20px;line-height:1}
.bar .dot{position:absolute;top:7px;right:calc(50% - 22px);min-width:8px;height:8px;border-radius:4px;background:var(--sign);display:none}
.bar .dot.on{display:block}

/* シート */
.sheet{position:fixed;inset:0;background:rgba(6,9,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet.hidden{display:none}
.sheet-inner{width:100%;max-width:480px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--l2);
  border:1px solid var(--edge);border-bottom:0;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.sheet h2{margin:0;font-size:var(--h2);font-weight:600;line-height:1.25}
.sheet h3{margin:20px 0 8px;font-size:var(--small);color:var(--muted);font-weight:500}
.sheet p{margin:8px 0 0;font-size:var(--small);line-height:1.55;color:var(--muted)}
.sheet p.lead{font-size:var(--body);color:var(--text)}
.top{display:flex;align-items:flex-start;gap:12px}
.top .big{flex:none;font-size:32px;line-height:1}
.top > div{flex:1;min-width:0}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:2px}
.pips i{width:8px;height:8px;border-radius:50%;border:1px solid var(--sign)}
.pips i.on{background:var(--sign)}
.ok{color:var(--ok)} .ng{color:var(--ng)} .late{color:var(--late)} .muted{color:var(--muted)} .signc{color:var(--sign)}

.list{background:var(--l1);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--edge)}
.row:first-child{border-top:0}
.row .ic{font-size:24px;width:32px;text-align:center;flex:none}
.row .bd{flex:1;min-width:0;font-size:var(--small);line-height:1.45;color:var(--muted)}
.row .bd b{display:block;font-size:var(--body);font-weight:500;color:var(--text)}
.row .fx{display:inline-block;margin-top:4px;font-size:var(--meta);font-weight:500;padding:1px 8px;border-radius:6px}
.row .fx.ok{background:rgba(92,201,139,.14)} .row .fx.ng{background:rgba(240,100,100,.14)}
.row.off .ic,.row.off b{opacity:.5}

.btn{min-width:76px;height:40px;padding:0 12px;border-radius:10px;background:var(--sign);color:var(--ink);font-weight:500;font-size:var(--small);flex:none;font-variant-numeric:tabular-nums}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--edge2)}
.btn.price{background:rgba(255,205,28,.08);color:var(--sign);border:1px solid rgba(255,205,28,.45)}
.btn:disabled{background:transparent;color:var(--muted);border:1px solid var(--edge)}
.btn.wide{width:100%;height:48px;margin-top:16px;font-size:var(--body)}
.textbtn{display:block;margin:16px auto 0;padding:10px 16px;color:var(--ng);font-size:var(--small)}

.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.stat > div{background:var(--l1);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
.stat > div > small{display:block;font-size:var(--meta);color:var(--muted)}
.stat b small{font-size:var(--small);font-weight:400;color:var(--muted);margin-left:2px}
.stat b{font-size:var(--h2);font-weight:500;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:var(--small);background:var(--l1);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.tbl td{padding:8px 12px;border-top:1px solid var(--edge);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl small{display:block;color:var(--muted);font-size:var(--meta)}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.close{float:right;font-size:20px;color:var(--muted);width:44px;height:44px;margin:-10px -10px 0 8px}
details.locked{margin-top:12px;font-size:var(--small);color:var(--muted)}
details.locked summary{padding:10px 0;cursor:pointer}
details.locked .row{opacity:.6}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translateX(-50%);background:var(--l2);
  border:1px solid var(--edge2);padding:8px 14px;border-radius:10px;font-size:var(--small);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="hud">
  <div class="hud-main">
    <div class="money" id="money">¥0</div>
    <div class="clock"><span id="day">1日目</span><b id="time">06:00</b></div>
  </div>
  <div class="hud-sub">
    <div class="status"><span class="rep" id="rep"></span><span class="rank" id="rank"></span><span class="event" id="event"></span></div>
    <div class="speed" id="speed" role="group" aria-label="時間の速さ">
      <button data-sp="0" aria-label="一時停止">停止</button><button data-sp="1" class="on" aria-label="等速">×1</button><button data-sp="2" aria-label="2倍速">×2</button><button data-sp="4" aria-label="4倍速">×4</button>
    </div>
  </div>
</header>
<section class="board" id="board" aria-label="発着案内" aria-live="polite"></section>
<canvas id="cv" aria-label="空港の地図"></canvas>
<button class="advisor" id="advisor"></button>
<nav class="bar">
  <button data-open="air"><span>✈️</span>航空会社<i class="dot" id="dotAir"></i></button>
  <button data-open="goal"><span>🎯</span>目標</button>
  <button data-open="today"><span>📊</span>きょう</button>
  <button data-open="menu"><span>⚙️</span>設定</button>
</nav>
<div class="sheet hidden" id="sheet"><div class="sheet-inner" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>

// ============ 基本 ============
const SAVE_KEY = 'soranominato-v1';

const rnd = (a, b) => a + Math.random() * (b - a);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const num = n => Math.round(n).toLocaleString('ja-JP');
const hhmm = t => { const m = Math.floor(t) + 360; return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// ============ データ ============
const SIZE_NAME = ['', '小型機', '中型機', '大型機'];
const GATE_NAME = ['', 'ゲートS', 'ゲートM', 'ゲートL'];

const GATE_UP = [0, 30, 90, 260];            // 1日の維持費
const GATE_RANK = [0, 1, 2, 3];

};

// ============ 状態 ============
let S = null;            // セーブされる状態
let C = {};              // 建物から計算する値（キャッシュ）
let speed = 1, lastSpeed = 1, acc = 0, sel = null, lowPower = false;
const floats = [];

function newToday() { return { pax: 0, flights: 0, ontime: 0, late: 0, cancels: 0, fees: 0, shop: 0, upkeep: 0, peak: 0, crowdWarn: false }; }
function newGame() {
  S = {
    v: 1, money: 3000, day: 1, t: 0, rep: 30, rank: 1, runway: 1, land: 3,
    grid: Array(COLS * TROWS).fill(null), gates: Array(COLS).fill(0),
    contracts: [], offers: [], flights: [], rec: [], rwb: 1, fid: 1, cid: 1,
    ema: { flow: 0, crowd: 0 }, today: newToday(), last: null, missions: {}, event: null, nextEvent: null,
    dayOver: false, seenHelp: false, totals: { pax: 0, flights: 0 },
  };
  S.gates[1] = 1;
  S.grid[0 * COLS + 1] = { k: 'counter', earn: 0, hr: 0 };
  S.grid[1 * COLS + 2] = { k: 'plant', earn: 0, hr: 0 };
  S.contracts.push({ id: S.cid++, name: 'そよかぜ航空', color: '#3fa7d6', dest: '札幌', size: 1, perDay: 4, fee: 150, pax: 60, intl: 0 });
  recalc();
  for (let i = 0; i < 3; i++) S.offers.push(genOffer());
  scheduleDay(0);
}

// ============ セーブ ============
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return false;
    S = d; recalc(); return true;
  } catch (e) { return false; }
}

// ============ 計算 ============
function cnt(k) { return C.counts?.[k] || 0; }
function gateCount() { return S.gates.filter(g => g > 0).length; }
function idx(r, c) { return r * COLS + c; }
function neighbors(r, c) {
  const out = [];
  for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nc < 0 || nr >= S.land || nc >= COLS) continue;
    out.push([nr, nc]);
  }
  return out;
}
function adjInfo(r, c, k) {
  const f = FAC[k]; let m = 0; const parts = [];
  if (f.adj) for (const [nr, nc] of neighbors(r, c)) {
    const n = S.grid[idx(nr, nc)];
    if (n && f.adj[n.k] != null) { m += f.adj[n.k]; parts.push([FAC[n.k].name, f.adj[n.k]]); }
  }
  m = clamp(m, -.3, .5);
  let mul = 1 + m;
  if (f.edge && r === 0) { mul *= 2; parts.push(['いちばん上の列', '×2']); }
  return { mul, parts };
}
function recalc() {
  C = { ccap: 0, ciqCap: 0, comfort: 0, repBonus: 0, paxMul: 0, variety: 0, counts: {}, shops: {}, upkeep: 0 };
  const repTypes = new Set(), variety = new Set();
  for (let r = 0; r < TROWS; r++) for (let c = 0; c < COLS; c++) {
    const b = S.grid[idx(r, c)]; if (!b) continue;
    const f = FAC[b.k];
    C.counts[b.k] = (C.counts[b.k] || 0) + 1;
    const lv = lvOf(b);
    C.upkeep += f.up * LV_UP[lv];
    if (b.k === 'counter') C.ccap += f.cap * LV_CAP[lv];
    else if (b.k === 'ciq') C.ciqCap += f.cap * LV_CAP[lv];
    else variety.add(b.k);
    if (f.comfort) C.comfort += f.comfort * LV_COMFORT[lv];
    if (f.rep && !repTypes.has(b.k)) { repTypes.add(b.k); C.repBonus += f.rep; }
    if (f.paxMul) C.paxMul += f.paxMul;
    if (f.shop) (C.shops[b.k] ||= []).push({ b, mul: adjInfo(r, c, b.k).mul });
  }
  C.variety = variety.size;
  for (const g of S.gates) C.upkeep += GATE_UP[g];
  C.upkeep += RUNWAY[S.runway].up;
  markStatic();
}
function repParts() {
  const ontime = S.rec.length ? S.rec.reduce((a, b) => a + b, 0) / S.rec.length : 1;
  const wait = clamp(1 - S.ema.crowd * 2, 0, 1);
  const need = 2 + S.ema.flow / 40;
  const comfort = clamp(C.comfort / need, 0, 1);
  const variety = Math.min(24, C.variety * 2);
  return { ontime, wait, comfort, variety, bonus: C.repBonus };
}
function repTarget() {
  const p = repParts();
  return clamp(10 + 40 * (.4 * p.ontime + .3 * p.wait + .3 * p.comfort) + p.variety + p.bonus, 0, 100);
}

// ============ 便と契約 ============
function genOffer() {
  const r = S.rank;
  const used = new Set([...S.contracts, ...S.offers].map(c => c.name + c.dest));
  const intl = cnt('ciq') > 0 && Math.random() < (r >= 4 ? .45 : .3);
  let maxS = 1;
  if (r >= 2 && S.rep >= 35) maxS = 2;
  if (r >= 3 && S.rep >= 50) maxS = 3;
  let size = 1; const x = Math.random();
  if (maxS >= 2 && x < (r >= 4 ? .85 : .6)) size = 2;
  if (maxS >= 3 && x < (r >= 4 ? .45 : .28)) size = 3;
  if (intl) size = Math.max(2, size);
  let name, color, dest;
  for (let i = 0; i < 30; i++) {
    [name, color] = pick(intl ? INTL : AIRLINES); dest = pick(intl ? INTL_DEST : DOM_DEST);
    if (!used.has(name + dest)) break;
  }
  const perDay = size === 3 ? ri(1, 3) : size === 2 ? ri(2, 4) : ri(2, 5);
  const fm = rnd(.85, 1.2);
  return {
    id: S.cid++, name, color, dest, size, perDay, intl: intl ? 1 : 0,
    fee: Math.round(FEE[size] * fm * (intl ? 1.6 : 1) / 10) * 10,
    pax: Math.round(PAX[size] * (intl ? 1.1 : 1) * rnd(.9, 1.12)),
  };
}
function addFlights(c, fromT) {
  const ev = EVENTS[S.event] || {};
  const start = 60, end = 960, span = (end - start) / c.perDay;
  for (let i = 0; i < c.perDay; i++) {
    const arr = Math.round((start + (i + rnd(.1, .9)) * span) / 5) * 5;
    if (arr < fromT + 10) continue;
    S.flights.push({
      id: S.fid++, cid: c.id, name: c.name, color: c.color, dest: c.dest, size: c.size, intl: c.intl,
      pax: Math.round(c.pax * (1 + C.paxMul) * (ev.paxMul || 1) * rnd(.85, 1.1)), fee: c.fee,
      arr, st: 'sched', t0: 0, gate: -1, why: '',
    });
  }
  S.flights.sort((a, b) => a.arr - b.arr);
}
function scheduleDay(fromT) { S.flights = []; for (const c of S.contracts) addFlights(c, fromT); }
function gateBusy() {
  const busy = new Set();
  for (const f of S.flights) if (f.gate >= 0 && (f.st === 'land' || f.st === 'in' || f.st === 'park' || f.st === 'ready')) busy.add(f.gate);
  return busy;
}
function findGate(size) {
  const busy = gateBusy(); let best = -1;
  for (let i = 0; i < COLS; i++) {
    const g = S.gates[i];
    if (g >= size && !busy.has(i) && (best < 0 || g < S.gates[best])) best = i;
  }
  return best;
}
function hasGateFor(size) { return S.gates.some(g => g >= size); }
function gateLoad() {
  // ざっくりした混み具合：必要な駐機時間 ÷ 使えるゲートの時間
  let need = 0; for (const c of S.contracts) need += c.perDay * (TURN[c.size] + 8);
  const cap = gateCount() * 900;
  return cap ? need / cap : (need ? 9 : 0);
}

// ============ 1分ずつ進める ============
function stepMinute() {
  const t = S.t, ev = EVENTS[S.event] || {}, D = S.today;
  S.rwb = Math.min(1.5, S.rwb + RUNWAY[S.runway].cap * (ev.rwMul || 1) / 60);
  for (const f of S.flights) {
    const el = t - f.t0;
    if (f.st === 'sched' && t >= f.arr) f.st = 'hold';
    else if (f.st === 'land' && el >= 3) { f.st = 'in'; f.t0 = t; }
    else if (f.st === 'in' && el >= 3) { f.st = 'park'; f.t0 = t; }
    else if (f.st === 'park' && el >= TURN[f.size]) { f.st = 'ready'; f.t0 = t; }
    else if (f.st === 'out' && el >= 3) { f.st = 'tko'; f.t0 = t; }
    else if (f.st === 'tko' && el >= 2) { f.st = 'done'; }
  }
  // 出発が先（ゲートを空けるため）
  for (const f of S.flights) if (f.st === 'ready' && S.rwb >= 1) { S.rwb--; f.st = 'out'; f.t0 = t; }
  const fog = ev.fogUntil && t < ev.fogUntil;
  for (const f of S.flights) {
    if (f.st !== 'hold') continue;
    const g = fog ? -1 : findGate(f.size);
    if (fog) f.why = '霧';
    else if (g < 0) f.why = hasGateFor(f.size) ? 'ゲートが満杯' : GATE_NAME[f.size] + 'がない';
    else if (S.rwb < 1) f.why = '滑走路の混雑';
    else {
      {
        S.rwb--; f.st = 'land'; f.t0 = t; f.gate = g;
        const delay = t - f.arr;
        S.money += f.fee; D.fees += f.fee; D.flights++; S.totals.flights++;
        const score = delay <= 15 ? 1 : delay <= 45 ? .6 : .3;
        if (delay <= 15) D.ontime++; else D.late++;
        pushRec(score);
        continue;
      }
    }
    if (t - f.arr >= 90) cancelFlight(f);
  }
  // 旅客の流れ
  let flowD = 0, flowI = 0;
  for (const f of S.flights) if (f.st === 'park') { const p = f.pax / TURN[f.size]; if (f.intl) flowI += p; else flowD += p; }
  const flow = flowD + flowI;
  D.pax += flow; S.totals.pax += flow;
  const ratio = flow > 0 ? Math.min(1, (C.ccap / 60) / flow) : 1;
  const sD = flowD * ratio;
  const sI = Math.min(flowI * ratio, C.ciqCap / 60);
  const served = sD + sI;
  const crowd = flow > 0 ? 1 - served / flow : 0;
  S.ema.crowd += (crowd - S.ema.crowd) * .03;
  S.ema.flow += (flow * 60 - S.ema.flow) * .02;
  D.peak = Math.max(D.peak, flow * 60);
  if (S.ema.crowd > .25 && !D.crowdWarn) { D.crowdWarn = true; toast('🧾 カウンターに行列ができています'); }
  // お店
  for (const k in C.shops) {
    const sh = FAC[k].shop, list = C.shops[k];
    const demand = (sh.intl ? sI : served) * sh.draw;
    // 客は各店の受け入れ数に比例して分かれる
    const caps = list.map(s => sh.cap / 60 * LV_CAP[lvOf(s.b)]), capSum = caps.reduce((a, b) => a + b, 0);
    const tot = Math.min(demand, capSum), sm = ev.shopMul?.[k] || 1;
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      const m = tot * caps[i] / capSum * sh.spend * LV_SPEND[lvOf(s.b)] * s.mul * sm;
      S.money += m; D.shop += m; s.b.earn += m; s.b.hr += m;
    }
  }
  // 評判
  S.rep += (repTarget() - S.rep) * .002;
  S.t++;
  if (S.t % 60 === 0) hourly();
  if (S.t >= DAY_LEN) endDay();
}
function pushRec(v) { S.rec.push(v); if (S.rec.length > 30) S.rec.shift(); }
function cancelFlight(f) {
  f.st = 'cancel'; S.today.cancels++; pushRec(0); S.rep = Math.max(0, S.rep - 1.5);
  toast(`✈️ ${f.name}（${f.dest}）が欠航：${f.why || '遅れ'}`);
}
function hourly() {
  if (!lowPower) for (let r = 0; r < S.land; r++) for (let c = 0; c < COLS; c++) {
    const b = S.grid[idx(r, c)];
    if (b && b.hr >= 1) floats.push({ x: (c + .5) * cell, y: yTm + (r + .3) * cell, text: '+' + Math.round(b.hr), life: 1.4 });
  }
  for (const b of S.grid) if (b) b.hr = 0;
  checkMissions(); save();
}

// ============ 1日の終わり ============
function endDay() {
  const D = S.today;
  for (const f of S.flights) if (f.st === 'hold' || f.st === 'sched') { f.why = f.why || '運用時間の終わり'; f.st = 'cancel'; D.cancels++; pushRec(0); }
  D.upkeep = C.upkeep; S.money -= C.upkeep;
  checkMissions();
  let rankUp = null;
  const nx = RANKS[S.rank + 1];
  if (nx && D.pax >= nx.pax && S.rep >= nx.rep && (!nx.need || cnt(nx.need) > 0)) { S.rank++; rankUp = nx.name; }
  S.last = { ...D, day: S.day, rep: S.rep };
  S.offers = []; for (let i = 0; i < 3; i++) S.offers.push(genOffer());
  S.seenOffers = false;
  S.nextEvent = Math.random() < .35 ? pick(Object.keys(EVENTS)) : null;
  S.dayOver = true; save();
  openReport(rankUp);
}
function startDay() {
  S.day++; S.t = 0; S.today = newToday(); S.dayOver = false; S.rwb = 1;
  S.event = S.nextEvent; S.nextEvent = null;
  for (const b of S.grid) if (b) { b.earn = 0; b.hr = 0; }
  scheduleDay(0); save(); closeSheet(); updateHud();
  if (S.event) toast(`きょうは「${EVENTS[S.event].name}」：${EVENTS[S.event].desc}`);
}
function checkMissions() {
  for (const m of MISSIONS) {
    if (m.rank > S.rank || S.missions[m.id]) continue;
    if (m.chk()) { S.missions[m.id] = 1; S.money += m.rw; toast(`🎯 目標達成「${m.text}」 +${yen(m.rw)}`); }
  }
}

// ============ 操作 ============
function build(r, c, k) {
  const f = FAC[k];
  if (S.money < f.cost || S.grid[idx(r, c)]) return;
  if (f.max && cnt(k) >= f.max) return;
  S.money -= f.cost; S.grid[idx(r, c)] = { k, earn: 0, hr: 0 };
  recalc(); checkMissions(); save(); closeSheet();
}
function refund(b) { let t = FAC[b.k].cost; for (let l = 2; l <= lvOf(b); l++) t += FAC[b.k].cost * LV_COST[l]; return Math.floor(t / 2); }
function levelUp(r, c) {
  const b = S.grid[idx(r, c)]; if (!b) return;
  const lv = lvOf(b); if (lv >= 3) return;
  const cost = Math.round(FAC[b.k].cost * LV_COST[lv + 1]);
  if (S.money < cost) return;
  S.money -= cost; b.lv = lv + 1; recalc(); checkMissions(); save(); openCell(r, c);
}
function demolish(r, c) {
  const b = S.grid[idx(r, c)]; if (!b) return;
  S.money += refund(b); S.grid[idx(r, c)] = null;
  recalc(); save(); closeSheet();
}
function upgradeGate(i) {
  const lv = S.gates[i] + 1; if (lv > 3) return;
  if (S.money < GATE_COST[lv] || S.rank < GATE_RANK[lv]) return;
  if (gateBusy().has(i) && lv === 1) return;
  S.money -= GATE_COST[lv]; S.gates[i] = lv; recalc(); checkMissions(); save(); openGate(i);
}
function upgradeRunway() {
  const nx = RUNWAY[S.runway + 1]; if (!nx || S.money < nx.cost || S.rank < nx.rank) return;
  S.money -= nx.cost; S.runway++; recalc(); checkMissions(); save(); openRunway();
}
function buyLand() {
  const cost = LAND_COST[S.land]; if (!cost || S.money < cost) return;
  S.money -= cost; S.land++; recalc(); checkMissions(); save(); closeSheet();
}
function acceptOffer(id) {
  const i = S.offers.findIndex(o => o.id === id); if (i < 0) return;
  const c = S.offers.splice(i, 1)[0]; S.contracts.push(c);
  if (!S.dayOver) addFlights(c, S.t);
  checkMissions(); save(); openAir();
}
function dropContract(id) {
  const i = S.contracts.findIndex(c => c.id === id); if (i < 0) return;
  S.contracts.splice(i, 1);
  S.flights = S.flights.filter(f => !(f.cid === id && f.st === 'sched'));
  S.rep = Math.max(0, S.rep - 1); save(); openAir();
}

// ============ 画面の大きさ ============
const cv = $('#cv'), ctx = cv.getContext('2d');
const st = document.createElement('canvas'), sctx = st.getContext('2d');
let cell = 44, W = 352, H = 440, RW, TX, AP, yRw = 0, yTx, yAp, yTm, dpr = 1, staticDirty = true;
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = Math.min(window.innerWidth - 16, 460);
  const other = ['.hud', '#board', '#advisor', '.bar'].reduce((a, q) => a + ($(q)?.offsetHeight || 0), 0);
  const vh = window.innerHeight - other - 60;
  cell = Math.floor(Math.min(vw / COLS, vh / 10.3));
  W = cell * COLS; RW = cell * 1.5; TX = cell * .55; AP = cell * 1.25;
  yTx = RW; yAp = RW + TX; yTm = yAp + AP; H = yTm + cell * TROWS;
  for (const c of [cv, st]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  markStatic();
}
function markStatic() { staticDirty = true; requestDraw(); }
function rwY(kind) { // kind: 'a' 着陸 / 'd' 離陸
  if (S.runway >= 4) return yRw + RW * (kind === 'a' ? .27 : .73);
  return yRw + RW * .5;
}

// ============ 描画（動かないもの） ============
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function drawRunway(g, cy, h) {
  g.fillStyle = '#3a3f46'; g.fillRect(cell * .15, cy - h / 2, W - cell * .3, h);
  g.fillStyle = '#e8e8e8';
  for (let x = cell * .9; x < W - cell * .9; x += cell * .7) g.fillRect(x, cy - 1, cell * .38, 2);
  for (let i = 0; i < 4; i++) {
    const yy = cy - h / 2 + h * (.12 + i * .22);
    g.fillRect(cell * .25, yy, cell * .3, h * .1); g.fillRect(W - cell * .55, yy, cell * .3, h * .1);
  }
}
function drawStatic() {
  const g = sctx; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#3d6b47'; g.fillRect(0, 0, W, H);
  // 滑走路
  if (S.runway >= 4) { drawRunway(g, rwY('a'), RW * .3); drawRunway(g, rwY('d'), RW * .3); }
  else drawRunway(g, rwY('a'), RW * (S.runway >= 3 ? .46 : S.runway >= 2 ? .42 : .38));
  // 誘導路
  const ty = yTx + TX / 2;
  g.fillStyle = '#545b64'; g.fillRect(0, yTx + TX * .18, W, TX * .64);
  g.fillRect(W * .74 - cell * .18, rwY('a'), cell * .36, ty - rwY('a'));
  g.fillRect(cell * .5 - cell * .18, rwY('d'), cell * .36, ty - rwY('d'));
  if (S.runway >= 2) g.fillRect(W * .42 - cell * .18, rwY('a'), cell * .36, ty - rwY('a'));
  g.strokeStyle = '#e8c547'; g.lineWidth = 1.5; g.setLineDash([]);
  g.beginPath(); g.moveTo(0, ty); g.lineTo(W, ty); g.stroke();

function along(pts, p) {
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); seg.push(d); total += d; }
  let d = clamp(p, 0, 1) * total;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {
      const q = seg[i] ? d / seg[i] : 1, a = pts[i], b = pts[i + 1];
      return { x: lerp(a[0], b[0], q), y: lerp(a[1], b[1], q), ang: Math.atan2(b[1] - a[1], b[0] - a[0]), seg: i };
    }
    d -= seg[i];
  }
}

  const ya = rwY('a'), yd = rwY('d');

    const p = clamp(el / 3, 0, 1), e = 1 - (1 - p) ** 2;
    return { x: lerp(-cell * 1.5, W * .74, e), y: ya, ang: 0, sc: 1 + (1 - p) * .35, air: 1 - p };
  }
  if (f.st === 'in') {
    const q = along([[W * .74, ya], [W * .74, ty], [gx, ty], [gx, py]], el / 3);
    return { ...q, sc: 1 };
  }
  if (f.st === 'park' || f.st === 'ready') return { x: gx, y: py, ang: Math.PI / 2, sc: 1 };
  if (f.st === 'out') {
    const q = along([[gx, py], [gx, ty], [cell * .5, ty], [cell * .5, yd], [cell * .9, yd]], el / 3);
    if (q.seg === 0) q.ang = Math.PI / 2; // 押し出し（後ろ向き）
    return { ...q, sc: 1 };
  }
  if (f.st === 'tko') {
    const p = clamp(el / 2, 0, 1), e = p * p;
    return { x: lerp(cell * .9, W + cell * 2, e), y: yd - e * cell * .3, ang: -e * .15, sc: 1 + e * .45, air: e };
  }

}

    g.save(); g.translate(x + air * cell * .5, y + air * cell * .6); g.rotate(ang); g.fillStyle = 'rgba(0,0,0,.18)';
    g.beginPath(); g.ellipse(0, 0, L / 2, L * .1, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  g.save(); g.translate(x, y); g.rotate(ang);

  g.beginPath(); // 主翼
  g.moveTo(L * .08, 0); g.lineTo(-L * .12, -L * .46); g.lineTo(-L * .22, -L * .46); g.lineTo(-L * .1, 0);
  g.lineTo(-L * .22, L * .46); g.lineTo(-L * .12, L * .46); g.closePath(); g.fill();

  g.beginPath(); g.moveTo(-L * .36, 0); g.lineTo(-L * .48, -L * .19); g.lineTo(-L * .52, -L * .19); g.lineTo(-L * .46, 0);
  g.lineTo(-L * .52, L * .19); g.lineTo(-L * .48, L * .19); g.closePath(); g.fill();
  g.fillStyle = '#ffffff'; // 胴体
  rr(g, -L * .5, -L * .075, L, L * .15, L * .075); g.fill();
  g.fillStyle = color; g.fillRect(-L * .5, -L * .02, L * .75, L * .04);
