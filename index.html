<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="そらのみなと">
<meta name="theme-color" content="#0f1c2b">
<link rel="manifest" href="manifest.webmanifest">
<title>そらのみなと 試作</title>
<style>
:root{
  /* 空港の案内サインから取った配色 */
  --l0:#1b2129;            /* 地 */
  --l1:#232b35;            /* 板・行 */
  --l2:#2b3540;            /* シート */
  --edge:rgba(255,255,255,.09);
  --edge2:rgba(255,255,255,.16);
  --text:#edf1f5; --muted:#9aa7b4;
  --sign:#ffcd1c;          /* 操作できるもの・お金（唯一のアクセント） */
  --ink:#1b1600;           /* サイン黄の上の文字 */
  --ok:#5cc98b; --late:#f2a33a; --ng:#f06464;   /* 定刻・遅れ・欠航 */
  --meta:.75rem; --small:.875rem; --body:1rem; --h2:1.25rem; --h1:1.5rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--l0);color:var(--text);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-weight:400;line-height:1.5;overscroll-behavior:none}
body{overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 地図は画面いっぱい。情報は上下に半透明で重ねる */
#cv{position:fixed;inset:0;display:block;touch-action:none;background:#4a7838}
.glass{background:rgba(20,26,34,.84);border:1px solid var(--edge);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.topbar{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);width:calc(100% - 12px);max-width:560px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.topbar > *{pointer-events:auto}
.bottombar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);width:calc(100% - 12px);max-width:560px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bottombar > *{pointer-events:auto}

/* ヘッダー：お金 > 時刻 > 評判 の順に目立たせる */
.hud{border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.hud-main,.hud-sub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.money{font-size:var(--h2);font-weight:600;line-height:1.2;color:var(--sign);font-variant-numeric:tabular-nums}
.money.neg{color:var(--ng)}
.clock{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.clock span{font-size:var(--small);color:var(--muted)}
.clock b{font-size:var(--h2);font-weight:500;line-height:1.2}
.status{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:var(--small);white-space:nowrap;overflow:hidden}
.rep{color:var(--sign);letter-spacing:1px}
.rep .dim{color:#4a5562}
.rank{color:var(--text);font-weight:500}
.event{color:var(--late)}
.speed{display:flex;flex:none;border:1px solid var(--edge);border-radius:9px;overflow:hidden;background:var(--l1)}
.speed button{width:42px;height:32px;font-size:var(--meta);font-weight:500;color:var(--muted);border-left:1px solid var(--edge)}
.speed button:first-child{border-left:0}
.speed button.on{background:var(--sign);color:var(--ink)}

/* 発着案内（1行） */
.board{border-radius:10px;overflow:hidden;display:block;width:100%;text-align:left}
.fl{display:grid;grid-template-columns:3.2em 1fr auto auto;align-items:center;gap:8px;padding:6px 10px;font-size:var(--small);line-height:1.4}
.fl time{font-variant-numeric:tabular-nums;color:var(--sign);font-weight:500}
.fl .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .who i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.fl .who small{color:var(--muted);font-size:var(--meta);margin-left:6px}
.fl .cnt{color:var(--muted);font-size:var(--meta);font-variant-numeric:tabular-nums}
.chip{font-size:var(--meta);font-weight:500;padding:1px 8px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.late{color:var(--late)} .chip.ng{color:var(--ng);background:rgba(240,100,100,.12)} .chip.mute{color:var(--muted)}

/* 拡大縮小 */
.zoom{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.zoom button{width:44px;height:44px;font-size:20px;color:var(--text);border-top:1px solid var(--edge)}
.zoom button:first-child{border-top:0}

/* アドバイザー：次にやること */
.advisor{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  border-left:4px solid var(--edge2);border-radius:10px;font-size:var(--small);line-height:1.45}
.advisor.warn{border-left-color:var(--late)} .advisor.ng{border-left-color:var(--ng)} .advisor.tip{border-left-color:var(--sign)}
.advisor .go{margin-left:auto;color:var(--sign);font-weight:500;white-space:nowrap}

.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:12px;overflow:hidden}
.bar button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--meta);font-weight:500;color:var(--muted);gap:2px;position:relative;border-left:1px solid var(--edge)}
.bar button:first-child{border-left:0}
.bar button span{font-size:20px;line-height:1}
.bar .dot{position:absolute;top:7px;right:calc(50% - 22px);min-width:8px;height:8px;border-radius:4px;background:var(--sign);display:none}
.bar .dot.on{display:block}
@media (orientation:landscape) and (max-height:500px){
  .topbar{flex-direction:row;max-width:none;align-items:stretch} .topbar .hud{flex:1} .topbar .board{flex:1;align-self:flex-start}
  .bottombar{flex-direction:row;max-width:none;align-items:stretch} .bottombar .advisor{flex:1} .bottombar .bar{width:280px}
  .bar button{height:44px}
}

/* シート */
.sheet{position:fixed;inset:0;background:rgba(6,9,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet.hidden{display:none}
.sheet-inner{width:100%;max-width:480px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--l2);
  border:1px solid var(--edge);border-bottom:0;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.sheet h2{margin:0;font-size:var(--h2);font-weight:600;line-height:1.25}
.sheet h3{margin:20px 0 8px;font-size:var(--small);color:var(--muted);font-weight:500}
.sheet p{margin:8px 0 0;font-size:var(--small);line-height:1.55;color:var(--muted)}
.sheet p.lead{font-size:var(--body);color:var(--text)}
.top{display:flex;align-items:flex-start;gap:12px}
.top .big{flex:none;font-size:32px;line-height:1}
.top > div{flex:1;min-width:0}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:2px}
.pips i{width:8px;height:8px;border-radius:50%;border:1px solid var(--sign)}
.pips i.on{background:var(--sign)}
.ok{color:var(--ok)} .ng{color:var(--ng)} .late{color:var(--late)} .muted{color:var(--muted)} .signc{color:var(--sign)}

.list{background:var(--l1);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--edge)}
.row:first-child{border-top:0}
.row .ic{font-size:24px;width:44px;text-align:center;flex:none}
.pix{display:block;width:44px;height:40px;object-fit:contain;image-rendering:pixelated}
.pix.big{width:64px;height:60px}
.row .bd{flex:1;min-width:0;font-size:var(--small);line-height:1.45;color:var(--muted)}
.row .bd b{display:block;font-size:var(--body);font-weight:500;color:var(--text)}
.row .fx{display:inline-block;margin-top:4px;font-size:var(--meta);font-weight:500;padding:1px 8px;border-radius:6px}
.row .fx.ok{background:rgba(92,201,139,.14)} .row .fx.ng{background:rgba(240,100,100,.14)}
.row.off .ic,.row.off b{opacity:.5}

.btn{min-width:76px;height:40px;padding:0 12px;border-radius:10px;background:var(--sign);color:var(--ink);font-weight:500;font-size:var(--small);flex:none;font-variant-numeric:tabular-nums}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--edge2)}
.btn.price{background:rgba(255,205,28,.08);color:var(--sign);border:1px solid rgba(255,205,28,.45)}
.btn:disabled{background:transparent;color:var(--muted);border:1px solid var(--edge)}
.btn.wide{width:100%;height:48px;margin-top:16px;font-size:var(--body)}
.textbtn{display:block;margin:16px auto 0;padding:10px 16px;color:var(--ng);font-size:var(--small)}

.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.stat > div{background:var(--l1);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
.stat > div > small{display:block;font-size:var(--meta);color:var(--muted)}
.stat b small{font-size:var(--small);font-weight:400;color:var(--muted);margin-left:2px}
.stat b{font-size:var(--h2);font-weight:500;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:var(--small);background:var(--l1);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.tbl td{padding:8px 12px;border-top:1px solid var(--edge);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl small{display:block;color:var(--muted);font-size:var(--meta)}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.close{float:right;font-size:20px;color:var(--muted);width:44px;height:44px;margin:-10px -10px 0 8px}
details.locked{margin-top:12px;font-size:var(--small);color:var(--muted)}
details.locked summary{padding:10px 0;cursor:pointer}
details.locked .row{opacity:.6}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);transform:translateX(-50%);background:var(--l2);
  border:1px solid var(--edge2);padding:8px 14px;border-radius:10px;font-size:var(--small);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="空港の地図（ドラッグで移動・2本指で拡大）"></canvas>
<div class="topbar">
<header class="hud glass">
  <div class="hud-main">
    <div class="money" id="money">¥0</div>
    <div class="clock"><span id="day">1日目</span><b id="time">06:00</b></div>
  </div>
  <div class="hud-sub">
    <div class="status"><span class="rep" id="rep"></span><span class="rank" id="rank"></span><span class="event" id="event"></span></div>
    <div class="speed" id="speed" role="group" aria-label="時間の速さ">
      <button data-sp="0" aria-label="一時停止">停止</button><button data-sp="1" class="on" aria-label="等速">×1</button><button data-sp="2" aria-label="2倍速">×2</button><button data-sp="4" aria-label="4倍速">×4</button>
    </div>
  </div>
</header>
<button class="board glass" id="board" aria-label="発着案内（タップで一覧）" aria-live="polite"></button>
</div>
<div class="zoom glass" role="group" aria-label="地図の大きさ"><button data-z="1" aria-label="拡大">＋</button><button data-z="-1" aria-label="縮小">－</button></div>
<div class="bottombar">
<button class="advisor glass" id="advisor"></button>
<nav class="bar glass">
  <button data-open="air"><span>✈️</span>航空会社<i class="dot" id="dotAir"></i></button>
  <button data-open="goal"><span>🎯</span>目標</button>
  <button data-open="today"><span>📊</span>きょう</button>
  <button data-open="menu"><span>⚙️</span>設定</button>
</nav>
</div>
<div class="sheet hidden" id="sheet"><div class="sheet-inner" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
'use strict';
// ============ 基本 ============
const SAVE_KEY = 'soranominato-v1';
const COLS = 8, TROWS = 7;
const DAY_LEN = 1080;          // 06:00〜24:00（分）
const MS_PER_MIN = 120;        // 等速で 1ゲーム分 = 0.12秒（1日 約2分10秒）
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const num = n => Math.round(n).toLocaleString('ja-JP');
const hhmm = t => { const m = Math.floor(t) + 360; return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// ============ データ ============
const SIZE_NAME = ['', '小型機', '中型機', '大型機'];
const GATE_NAME = ['', 'ゲートS', 'ゲートM', 'ゲートL'];
const GATE_COST = [0, 500, 2500, 9000];     // そのレベルにする費用
const GATE_UP = [0, 30, 90, 260];            // 1日の維持費
const GATE_RANK = [0, 1, 2, 3];
const TURN = [0, 50, 70, 95];               // 駐機時間（分）
const PAX = [0, 60, 160, 340];              // 1便の旅客（到着＋出発）
const FEE = [0, 120, 260, 560];             // 着陸料
const RUNWAY = [null,
  { cap: 6,  up: 0,   name: '滑走路 Lv1' },
  { cap: 10, up: 120, name: '滑走路 Lv2', cost: 4000, rank: 2, desc: '誘導路を増やす' },
  { cap: 16, up: 400, name: '滑走路 Lv3', cost: 20000, rank: 3, desc: '滑走路を延ばし、計器着陸装置をつける' },
  { cap: 28, up: 1500, name: '第2滑走路', cost: 90000, rank: 4, desc: '2本目の滑走路。着陸と離陸を分ける' },
];
const LAND_COST = [0, 0, 0, 1500, 6000, 18000, 45000]; // その行を買う費用（0〜2行目は最初から）
const RANKS = [null,
  { name: '地方空港' },
  { name: 'にぎわう空港', pax: 700,   rep: 40 },
  { name: '拠点空港',     pax: 3500,  rep: 54 },
  { name: '国際空港',     pax: 8000,  rep: 64, need: 'ciq' },
  { name: 'ハブ空港',     pax: 11000, rep: 74 },
];
const FAC = {
  counter:   { name: 'カウンター', icon: '🧾', color: '#3d6e8c', cost: 300, up: 25, rank: 1, cap: 120,
               desc: 'チェックインと保安検査。1時間に120人をさばく。足りないと行列ができて評判が下がる。' },
  bench:     { name: 'ベンチ', icon: '🪑', color: '#7a6a4a', cost: 80, up: 3, rank: 1, comfort: 2,
               desc: '快適さ+2。隣のお店（売店・カフェなど）の売上が上がる。' },
  plant:     { name: '植木', icon: '🌳', color: '#3f7a4a', cost: 50, up: 2, rank: 1, comfort: 1,
               desc: '快適さ+1。隣のお店の売上が上がる。' },
  toilet:    { name: 'トイレ', icon: '🚻', color: '#4a6a8a', cost: 250, up: 12, rank: 1, comfort: 5,
               desc: '快適さ+5。ただし隣の飲食店は売上が下がる。' },
  kiosk:     { name: '売店', icon: '🏪', color: '#b0603a', cost: 400, up: 20, rank: 1,
               shop: { draw: .30, spend: 4, cap: 80 }, adj: { bench: .1, plant: .1 },
               desc: '旅客の30%が立ち寄る。1時間に80人まで。' },
  parking:   { name: '駐車場', icon: '🅿️', color: '#4b5563', cost: 600, up: 15, rank: 1,
               shop: { draw: .25, spend: 3, cap: 200 },
               desc: '車で来る人の駐車料金。隣の効果は受けない。' },
  cafe:      { name: 'カフェ', icon: '☕', color: '#8a5a3c', cost: 1500, up: 50, rank: 2,
               shop: { draw: .22, spend: 3, cap: 60 }, adj: { bench: .15, plant: .1, toilet: -.15 },
               desc: '旅客の22%が立ち寄る。1時間に60人まで。ベンチの隣だとよく売れる。' },
  souvenir:  { name: 'おみやげ', icon: '🎁', color: '#b84a6a', cost: 2500, up: 70, rank: 2,
               shop: { draw: .15, spend: 5, cap: 50 }, adj: { plant: .1, kiosk: .1, cafe: .1 },
               desc: '旅客の15%が立ち寄る。お店どうしが隣だと売上が上がる（商店街）。' },
  lounge:    { name: 'ラウンジ', icon: '🛋️', color: '#5b4a8a', cost: 5000, up: 150, rank: 2, comfort: 3, rep: 2,
               shop: { draw: .05, spend: 12, cap: 30 }, adj: { plant: .15 },
               desc: '評判+2・快適さ+3。上客がゆっくり過ごす。' },
  restaurant:{ name: 'レストラン', icon: '🍜', color: '#a8452f', cost: 8000, up: 220, rank: 3,
               shop: { draw: .14, spend: 6, cap: 50 }, adj: { plant: .1, bench: .1, deck: .2, toilet: -.15 },
               desc: '旅客の14%が食事する。展望デッキの隣だと売上+20%。' },
  station:   { name: '駅', icon: '🚉', color: '#2f6d6a', cost: 25000, up: 600, rank: 3, rep: 5, paxMul: .15, max: 1,
               desc: '鉄道がつながる。どの便も旅客+15%・評判+5。1つまで。' },
  deck:      { name: '展望デッキ', icon: '🔭', color: '#2d6a8f', cost: 10000, up: 200, rank: 3, comfort: 4, rep: 3, edge: 1,
               shop: { draw: .10, spend: 3, cap: 120 }, adj: { plant: .1, bench: .1 },
               desc: '評判+3・快適さ+4。いちばん上の列（飛行機の見える場所）だと売上2倍。' },
  ciq:       { name: '出入国審査', icon: '🛂', color: '#35577a', cost: 15000, up: 350, rank: 3, cap: 150,
               desc: '国際線の旅客を1時間に150人さばく。国際線の契約と国際空港への昇格に必要。' },
  dutyfree:  { name: '免税店', icon: '💎', color: '#6a3fa0', cost: 30000, up: 700, rank: 4,
               shop: { draw: .30, spend: 10, cap: 60, intl: 1 }, adj: { plant: .1, lounge: .15, souvenir: .1 },
               desc: '国際線の旅客の30%が立ち寄る。ラウンジの隣だと売上+15%。' },
  hotel:     { name: 'ホテル', icon: '🏨', color: '#8a6a2f', cost: 80000, up: 2000, rank: 5, rep: 3,
               shop: { draw: .04, spend: 35, cap: 25 }, adj: { plant: .15, restaurant: .15 },
               desc: '評判+3。乗り継ぎ客が泊まる。' },
};
const LV_COST = [0, 0, 2, 4];          // レベルアップ費用（建てた値段の倍率）
const LV_CAP = [0, 1, 1.6, 2.3];          // お店の客数・カウンターの処理
const LV_SPEND = [0, 1, 1.2, 1.4];        // お店の客単価
const LV_COMFORT = [0, 1, 1.5, 2];
const LV_UP = [0, 1, 1.5, 2.2];           // 維持費
const lvOf = b => b.lv || 1;
const FAC_ORDER = ['counter','kiosk','bench','plant','toilet','parking','cafe','souvenir','lounge','restaurant','deck','station','ciq','dutyfree','hotel'];
const AIRLINES = [['そよかぜ航空','#3fa7d6'],['しろくま航空','#7f9bb3'],['つばめエア','#2b4c7e'],['みなみ風航空','#f08a5d'],
  ['ほしぞらエア','#6c5ce7'],['にじいろ航空','#e84393'],['あさひ航空','#e17055'],['もりのエア','#00a383'],
  ['こはく航空','#d9962b'],['るりいろ航空','#0984e3'],['さくら便','#f06292'],['ゆきどけエア','#5fa8e8']];

// ============ 状態 ============
let S = null;            // セーブされる状態

function newToday() { return { pax: 0, flights: 0, ontime: 0, late: 0, cancels: 0, fees: 0, shop: 0, upkeep: 0, peak: 0, crowdWarn: false }; }
function newGame() {

// ============ セーブ ============
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return false;
    S = d; recalc(); return true;
  } catch (e) { return false; }
}

// ============ 計算 ============
function cnt(k) { return C.counts?.[k] || 0; }
function gateCount() { return S.gates.filter(g => g > 0).length; }
function idx(r, c) { return r * COLS + c; }
function neighbors(r, c) {
  const out = [];
  for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nc < 0 || nr >= S.land || nc >= COLS) continue;
    out.push([nr, nc]);
  }
  return out;
}
function adjInfo(r, c, k) {
  const f = FAC[k]; let m = 0; const parts = [];
  if (f.adj) for (const [nr, nc] of neighbors(r, c)) {
    const n = S.grid[idx(nr, nc)];
    if (n && f.adj[n.k] != null) { m += f.adj[n.k]; parts.push([FAC[n.k].name, f.adj[n.k]]); }
  }
  m = clamp(m, -.3, .5);
  let mul = 1 + m;
  if (f.edge && r === 0) { mul *= 2; parts.push(['いちばん上の列', '×2']); }
  return { mul, parts };
}
function recalc() {
  C = { ccap: 0, ciqCap: 0, comfort: 0, repBonus: 0, paxMul: 0, variety: 0, counts: {}, shops: {}, upkeep: 0 };
  const repTypes = new Set(), variety = new Set();
  for (let r = 0; r < TROWS; r++) for (let c = 0; c < COLS; c++) {
    const b = S.grid[idx(r, c)]; if (!b) continue;
    const f = FAC[b.k];
    C.counts[b.k] = (C.counts[b.k] || 0) + 1;
    const lv = lvOf(b);
    C.upkeep += f.up * LV_UP[lv];
    if (b.k === 'counter') C.ccap += f.cap * LV_CAP[lv];
    else if (b.k === 'ciq') C.ciqCap += f.cap * LV_CAP[lv];
    else variety.add(b.k);
    if (f.comfort) C.comfort += f.comfort * LV_COMFORT[lv];
    if (f.rep && !repTypes.has(b.k)) { repTypes.add(b.k); C.repBonus += f.rep; }
    if (f.paxMul) C.paxMul += f.paxMul;
    if (f.shop) (C.shops[b.k] ||= []).push({ b, mul: adjInfo(r, c, b.k).mul });
  }
  C.variety = variety.size;
  for (const g of S.gates) C.upkeep += GATE_UP[g];
  C.upkeep += RUNWAY[S.runway].up;
  markStatic();
}
function repParts() {
  const ontime = S.rec.length ? S.rec.reduce((a, b) => a + b, 0) / S.rec.length : 1;
  const wait = clamp(1 - S.ema.crowd * 2, 0, 1);
  const need = 2 + S.ema.flow / 40;
  const comfort = clamp(C.comfort / need, 0, 1);
  const variety = Math.min(24, C.variety * 2);
  return { ontime, wait, comfort, variety, bonus: C.repBonus };
}
function repTarget() {
  const p = repParts();
  return clamp(10 + 40 * (.4 * p.ontime + .3 * p.wait + .3 * p.comfort) + p.variety + p.bonus, 0, 100);
}

// ============ 便と契約 ============
function genOffer() {
  const r = S.rank;
  const used = new Set([...S.contracts, ...S.offers].map(c => c.name + c.dest));
  const intl = cnt('ciq') > 0 && Math.random() < (r >= 4 ? .45 : .3);
  let maxS = 1;
  if (r >= 2 && S.rep >= 35) maxS = 2;
  if (r >= 3 && S.rep >= 50) maxS = 3;
  let size = 1; const x = Math.random();
  if (maxS >= 2 && x < (r >= 4 ? .85 : .6)) size = 2;
  if (maxS >= 3 && x < (r >= 4 ? .45 : .28)) size = 3;
  if (intl) size = Math.max(2, size);
  let name, color, dest;
  for (let i = 0; i < 30; i++) {
    [name, color] = pick(intl ? INTL : AIRLINES); dest = pick(intl ? INTL_DEST : DOM_DEST);
    if (!used.has(name + dest)) break;
  }
  const perDay = size === 3 ? ri(1, 3) : size === 2 ? ri(2, 4) : ri(2, 5);
  const fm = rnd(.85, 1.2);
  return {
    id: S.cid++, name, color, dest, size, perDay, intl: intl ? 1 : 0,
    fee: Math.round(FEE[size] * fm * (intl ? 1.6 : 1) / 10) * 10,
    pax: Math.round(PAX[size] * (intl ? 1.1 : 1) * rnd(.9, 1.12)),
  };
}
function addFlights(c, fromT) {
  const ev = EVENTS[S.event] || {};
  const start = 60, end = 960, span = (end - start) / c.perDay;
  for (let i = 0; i < c.perDay; i++) {
    const arr = Math.round((start + (i + rnd(.1, .9)) * span) / 5) * 5;
    if (arr < fromT + 10) continue;
    S.flights.push({
      id: S.fid++, cid: c.id, name: c.name, color: c.color, dest: c.dest, size: c.size, intl: c.intl,
      pax: Math.round(c.pax * (1 + C.paxMul) * (ev.paxMul || 1) * rnd(.85, 1.1)), fee: c.fee,
      arr, st: 'sched', t0: 0, gate: -1, why: '',
    });
  }
  S.flights.sort((a, b) => a.arr - b.arr);
}
function scheduleDay(fromT) { S.flights = []; for (const c of S.contracts) addFlights(c, fromT); }
function gateBusy() {
  const busy = new Set();
  for (const f of S.flights) if (f.gate >= 0 && (f.st === 'land' || f.st === 'in' || f.st === 'park' || f.st === 'ready')) busy.add(f.gate);
  return busy;
}
function findGate(size) {
  const busy = gateBusy(); let best = -1;
  for (let i = 0; i < COLS; i++) {
    const g = S.gates[i];
    if (g >= size && !busy.has(i) && (best < 0 || g < S.gates[best])) best = i;
  }
  return best;
}
function hasGateFor(size) { return S.gates.some(g => g >= size); }
function gateLoad() {
  // ざっくりした混み具合：必要な駐機時間 ÷ 使えるゲートの時間
  let need = 0; for (const c of S.contracts) need += c.perDay * (TURN[c.size] + 8);
  const cap = gateCount() * 900;
  return cap ? need / cap : (need ? 9 : 0);
}

// ============ 1分ずつ進める ============
function stepMinute() {
  const t = S.t, ev = EVENTS[S.event] || {}, D = S.today;
  S.rwb = Math.min(1.5, S.rwb + RUNWAY[S.runway].cap * (ev.rwMul || 1) / 60);
  for (const f of S.flights) {
    const el = t - f.t0;
    if (f.st === 'sched' && t >= f.arr) f.st = 'hold';
    else if (f.st === 'land' && el >= 3) { f.st = 'in'; f.t0 = t; }
    else if (f.st === 'in' && el >= 3) { f.st = 'park'; f.t0 = t; }
    else if (f.st === 'park' && el >= TURN[f.size]) { f.st = 'ready'; f.t0 = t; }
    else if (f.st === 'out' && el >= 3) { f.st = 'tko'; f.t0 = t; }
    else if (f.st === 'tko' && el >= 2) { f.st = 'done'; }
  }
  // 出発が先（ゲートを空けるため）
  for (const f of S.flights) if (f.st === 'ready' && S.rwb >= 1) { S.rwb--; f.st = 'out'; f.t0 = t; }
  const fog = ev.fogUntil && t < ev.fogUntil;
  for (const f of S.flights) {
    if (f.st !== 'hold') continue;
    const g = fog ? -1 : findGate(f.size);
    if (fog) f.why = '霧';
    else if (g < 0) f.why = hasGateFor(f.size) ? 'ゲートが満杯' : GATE_NAME[f.size] + 'がない';
    else if (S.rwb < 1) f.why = '滑走路の混雑';
    else {
      {
        S.rwb--; f.st = 'land'; f.t0 = t; f.gate = g;
        const delay = t - f.arr;
        S.money += f.fee; D.fees += f.fee; D.flights++; S.totals.flights++;
        const score = delay <= 15 ? 1 : delay <= 45 ? .6 : .3;
        if (delay <= 15) D.ontime++; else D.late++;
        pushRec(score);
        continue;
      }
    }
    if (t - f.arr >= 90) cancelFlight(f);
  }
  // 旅客の流れ
  let flowD = 0, flowI = 0;
  for (const f of S.flights) if (f.st === 'park') { const p = f.pax / TURN[f.size]; if (f.intl) flowI += p; else flowD += p; }
  const flow = flowD + flowI;
  D.pax += flow; S.totals.pax += flow;
  const ratio = flow > 0 ? Math.min(1, (C.ccap / 60) / flow) : 1;
  const sD = flowD * ratio;
  const sI = Math.min(flowI * ratio, C.ciqCap / 60);
  const served = sD + sI;
  const crowd = flow > 0 ? 1 - served / flow : 0;
  S.ema.crowd += (crowd - S.ema.crowd) * .03;
  S.ema.flow += (flow * 60 - S.ema.flow) * .02;
  D.peak = Math.max(D.peak, flow * 60);
  if (S.ema.crowd > .25 && !D.crowdWarn) { D.crowdWarn = true; toast('🧾 カウンターに行列ができています'); }
  // お店
  for (const k in C.shops) {
    const sh = FAC[k].shop, list = C.shops[k];
    const demand = (sh.intl ? sI : served) * sh.draw;
    // 客は各店の受け入れ数に比例して分かれる
    const caps = list.map(s => sh.cap / 60 * LV_CAP[lvOf(s.b)]), capSum = caps.reduce((a, b) => a + b, 0);
    const tot = Math.min(demand, capSum), sm = ev.shopMul?.[k] || 1;
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      const m = tot * caps[i] / capSum * sh.spend * LV_SPEND[lvOf(s.b)] * s.mul * sm;
      S.money += m; D.shop += m; s.b.earn += m; s.b.hr += m;
    }
  }
  // 評判
  S.rep += (repTarget() - S.rep) * .002;
  S.t++;
  if (S.t % 60 === 0) hourly();
  if (S.t >= DAY_LEN) endDay();
}
function pushRec(v) { S.rec.push(v); if (S.rec.length > 30) S.rec.shift(); }
function cancelFlight(f) {
  f.st = 'cancel'; S.today.cancels++; pushRec(0); S.rep = Math.max(0, S.rep - 1.5);
  toast(`✈️ ${f.name}（${f.dest}）が欠航：${f.why || '遅れ'}`);
}
function hourly() {
  if (!lowPower) for (let r = 0; r < S.land; r++) for (let c = 0; c < COLS; c++) {
    const b = S.grid[idx(r, c)];
    if (b && b.hr >= 1) { const [x0, y0] = cellOf(r, c); floats.push({ wx: x0 + 8, wy: y0 + 8, text: '+' + Math.round(b.hr), life: 1.4, rise: 0 }); }
  }
  for (const b of S.grid) if (b) b.hr = 0;
  checkMissions(); save();
}

// ============ 1日の終わり ============
function endDay() {
  const D = S.today;
  for (const f of S.flights) if (f.st === 'hold' || f.st === 'sched') { f.why = f.why || '運用時間の終わり'; f.st = 'cancel'; D.cancels++; pushRec(0); }
  D.upkeep = C.upkeep; S.money -= C.upkeep;
  checkMissions();
  let rankUp = null;
  const nx = RANKS[S.rank + 1];
  if (nx && D.pax >= nx.pax && S.rep >= nx.rep && (!nx.need || cnt(nx.need) > 0)) { S.rank++; rankUp = nx.name; }
  S.last = { ...D, day: S.day, rep: S.rep };
  S.offers = []; for (let i = 0; i < 3; i++) S.offers.push(genOffer());
  S.seenOffers = false;
  S.nextEvent = Math.random() < .35 ? pick(Object.keys(EVENTS)) : null;
  S.dayOver = true; save();
  openReport(rankUp);
}
function startDay() {
  S.day++; S.t = 0; S.today = newToday(); S.dayOver = false; S.rwb = 1;
  S.event = S.nextEvent; S.nextEvent = null;
  for (const b of S.grid) if (b) { b.earn = 0; b.hr = 0; }
  scheduleDay(0); save(); closeSheet(); updateHud();
  if (S.event) toast(`きょうは「${EVENTS[S.event].name}」：${EVENTS[S.event].desc}`);
}
function checkMissions() {
  for (const m of MISSIONS) {
    if (m.rank > S.rank || S.missions[m.id]) continue;
    if (m.chk()) { S.missions[m.id] = 1; S.money += m.rw; toast(`🎯 目標達成「${m.text}」 +${yen(m.rw)}`); }
  }
}

// ============ 操作 ============
function build(r, c, k) {
  const f = FAC[k];
  if (S.money < f.cost || S.grid[idx(r, c)]) return;
  if (f.max && cnt(k) >= f.max) return;
  S.money -= f.cost; S.grid[idx(r, c)] = { k, earn: 0, hr: 0 };
  recalc(); checkMissions(); save(); closeSheet();
}
function refund(b) { let t = FAC[b.k].cost; for (let l = 2; l <= lvOf(b); l++) t += FAC[b.k].cost * LV_COST[l]; return Math.floor(t / 2); }
function levelUp(r, c) {
  const b = S.grid[idx(r, c)]; if (!b) return;
  const lv = lvOf(b); if (lv >= 3) return;
  const cost = Math.round(FAC[b.k].cost * LV_COST[lv + 1]);
  if (S.money < cost) return;
  S.money -= cost; b.lv = lv + 1; recalc(); checkMissions(); save(); openCell(r, c);
}
function demolish(r, c) {
  const b = S.grid[idx(r, c)]; if (!b) return;
  S.money += refund(b); S.grid[idx(r, c)] = null;
  recalc(); save(); closeSheet();
}
function upgradeGate(i) {
  const lv = S.gates[i] + 1; if (lv > 3) return;
  if (S.money < GATE_COST[lv] || S.rank < GATE_RANK[lv]) return;
  if (gateBusy().has(i) && lv === 1) return;
  S.money -= GATE_COST[lv]; S.gates[i] = lv; recalc(); checkMissions(); save(); openGate(i);
}
function upgradeRunway() {
  const nx = RUNWAY[S.runway + 1]; if (!nx || S.money < nx.cost || S.rank < nx.rank) return;
  S.money -= nx.cost; S.runway++; recalc(); checkMissions(); save(); openRunway();
}
function buyLand() {
  const cost = LAND_COST[S.land]; if (!cost || S.money < cost) return;
  S.money -= cost; S.land++; recalc(); checkMissions(); save(); closeSheet();
}
function acceptOffer(id) {
  const i = S.offers.findIndex(o => o.id === id); if (i < 0) return;
  const c = S.offers.splice(i, 1)[0]; S.contracts.push(c);
  if (!S.dayOver) addFlights(c, S.t);
  checkMissions(); save(); openAir();
}
function dropContract(id) {
  const i = S.contracts.findIndex(c => c.id === id); if (i < 0) return;
  S.contracts.splice(i, 1);
  S.flights = S.flights.filter(f => !(f.cid === id && f.st === 'sched'));
  S.rep = Math.max(0, S.rep - 1); save(); openAir();
}

// ============ 世界の座標 ============
// 1マス = 16ボクセル。x は画面の右下へ、y は左下へ、z は上へ。
// ボクセル1つは 横4×縦2 ドットのひし形の上面＋2ドットの側面で描く（斜め見下ろしのドット絵）。
const VC = 16;                                   // 1マスのボクセル数
const WX = 256, WY = 224;                        // 世界の広さ（ボクセル）
const RA = [8, 20], RB = [28, 40];               // 滑走路A・B の y 範囲
const TX0 = 50, TX1 = 62, TCL = 56;              // 誘導路
const AP0 = 62, TMY = 96;                        // エプロンの始まり・ターミナルの始まり
const TMX0 = 64, TMX1 = 192;                     // ターミナルの x 範囲（8列）
const ROAD0 = 208;                               // 道路
const OX = WY * 2 + 4, OY = 80;                  // 世界の原点の画面位置（原寸ドット）
const AW = (WX + WY) * 2 + 8, AH = WX + WY + OY + 6;
const proj = (x, y, z = 0) => [OX + (x - y) * 2, OY + (x + y) - 2 * z];
const gateCX = i => TMX0 + i * VC + 8;
const cellOf = (r, c) => [TMX0 + c * VC, TMY + r * VC];

const cv = $('#cv'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
const ground = mk(AW, AH), gg = ground.getContext('2d');
const fr = mk(10, 10), fg = fr.getContext('2d');
let dpr = 1, VW = 375, VH = 812, staticDirty = true;
const cam = { x: 0, y: 0, n: 4 };
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);

function openBuilding(r, c, b) {

  else if (b.k === 'counter') h += `<div class="stat"><div><small>全カウンターの処理</small><b>${num(C.ccap)}<small>人/時</small></b></div><div><small>いまの旅客の流れ</small><b class="${S.ema.flow > C.ccap ? 'ng' : ''}">${num(S.ema.flow)}<small>人/時</small></b></div></div>`;
  else if (b.k === 'ciq') h += `<div class="stat"><div><small>出入国審査の処理</small><b>${num(C.ciqCap)}<small>人/時</small></b></div></div>`;

  if (lv < 3) {
    const cost = Math.round(f.cost * LV_COST[lv + 1]);
    const gain = f.shop ? `客数×${LV_CAP[lv + 1]}・客単価×${LV_SPEND[lv + 1]}` : f.cap ? `処理 ${f.cap * LV_CAP[lv]}→${Math.round(f.cap * LV_CAP[lv + 1])}人/時` : f.comfort ? `快適さ ${f.comfort * LV_COMFORT[lv]}→${f.comfort * LV_COMFORT[lv + 1]}` : '効果アップ';
    h += `<h3>レベルアップ</h3><div class="list"><div class="row"><div class="ic">⬆️</div><div class="bd"><b>Lv${lv + 1} にする</b>${gain}・維持費×${LV_UP[lv + 1]}</div>
      <button class="btn" data-act="lvup" ${S.money < cost ? 'disabled' : ''}>${yen(cost)}</button></div></div>`;
  } else h += `<p class="ok">最大レベルです</p>`;
  h += `<h3>くわしく</h3><table class="tbl">`;
  if (f.shop) h += `<tr><td>隣の効果</td><td>${a.parts.length ? a.parts.map(p => `${p[0]} ${typeof p[1] === 'number' ? signed(p[1]) : p[1]}`).join('<br>') : 'なし'}</td></tr>
    <tr><td>受け入れ</td><td>1時間 ${Math.round(f.shop.cap * LV_CAP[lv])}人</td></tr>`;
  if (f.comfort) h += `<tr><td>快適さ</td><td>+${f.comfort * LV_COMFORT[lv]}</td></tr>`;
  h += `<tr><td>1日の維持費</td><td>${yen(f.up * LV_UP[lv])}</td></tr></table>`;
  h += `<button class="textbtn" data-act="demolish">取り壊す（${yen(refund(b))} 戻る）</button>`;
  openSheet(h);
}
function openGate(i) {
  sel = { type: 'gate', i };
  const lv = S.gates[i], nx = lv + 1;
  const f = S.flights.find(f => f.gate === i && ['land', 'in', 'park', 'ready'].includes(f.st));

  if (lv) h += `<div class="stat"><div><small>いま止まっている便</small><b style="font-size:var(--body)">${f ? `${f.name}（${f.dest}）` : 'なし'}</b></div><div><small>1日の維持費</small><b>${yen(GATE_UP[lv])}</b></div></div>`;

      <button class="btn price" data-act="gate" data-v="${i}" ${locked || S.money < GATE_COST[nx] ? 'disabled' : ''}>${yen(GATE_COST[nx])}</button></div></div>`;

}
function openRunway() {
  sel = null;

function openLand() {
  const cost = LAND_COST[S.land];
  if (!cost) return;
  openSheet(`${X}<h2>土地を広げる</h2><p class="lead">ターミナルを1列広げて、建てられるマスを${COLS}つ増やします。</p>

function contractRow(c, act) {
  const warns = [];
  if (!hasGateFor(c.size)) warns.push(`${GATE_NAME[c.size]}以上が必要`);
  if (c.intl && !cnt('ciq')) warns.push('出入国審査が必要');
  return `<div class="row"><div class="ic"><img class="pix" src="${planeIcon(c.size, c.color)}" alt=""></div><div class="bd">
    <b>${c.name}・${c.dest}線${c.intl ? '（国際）' : ''}</b>${SIZE_NAME[c.size]}・1日${c.perDay}便・${c.pax}人/便<br>着陸料 ${yen(c.fee)}/便
    ${warns.length ? `<br><span class="fx ng">${warns.join('・')}</span>` : ''}</div>
    ${act === 'accept' ? `<button class="btn price" data-act="accept" data-v="${c.id}">契約する</button>` : `<button class="btn ghost" data-act="drop" data-v="${c.id}">やめる</button>`}</div>`;
}
function openAir() {
  S.seenOffers = true;
  const load = gateLoad(), cap = RUNWAY[S.runway].cap;
  const need = S.contracts.reduce((a, c) => a + c.perDay * 2, 0) / 15;
  let h = `${X}<h2>航空会社</h2>
    <div class="stat"><div><small>ゲートの混み具合</small><b class="${load > .75 ? 'ng' : load > .55 ? 'late' : 'ok'}">${pct(load)}</b>${loadMeter(load)}</div>
    <div><small>滑走路（平均／上限）</small><b class="${need > cap * .6 ? 'late' : 'ok'}">${need.toFixed(1)}<small>／${cap}回</small></b>${loadMeter(need / cap / .8)}</div></div>
    <p>混み具合が70%をこえると、便が重なって待ちや欠航が出やすくなります。</p>
    <h3>新しい契約の話（毎朝入れかわります）</h3>`;
  h += S.offers.length ? `<div class="list">${S.offers.map(o => contractRow(o, 'accept')).join('')}</div>` : '<p>きょうの話はもうありません。あしたの朝に届きます。</p>';
  h += `<h3>契約中の路線（${S.contracts.length}）</h3>` + (S.contracts.length ? `<div class="list">${S.contracts.map(c => contractRow(c, 'drop')).join('')}</div>` : '<p>まだありません</p>');

}
function openGoal() {
  const p = repParts(), nx = RANKS[S.rank + 1];

  }

    <tr><td>快適さ<small>ベンチ・トイレ・植木など。旅客が多いほど必要</small>${meter(p.comfort)}</td><td>${pct(p.comfort)}</td></tr>

function openReport(rankUp) {

function openMenu() {
  openSheet(`${X}<h2>設定</h2>

async function offlineStatus() {
  if (!('serviceWorker' in navigator)) return ['このブラウザはオフライン起動に対応していません。', 'ng'];
  if (!window.isSecureContext) return ['無効：https のページ（GitHub Pages など）からホーム画面に追加したときだけ、機内モードで起動できます。', 'ng'];
  let ok = false;
  try { ok = !!navigator.serviceWorker.controller && (await caches.keys()).some(k => k.startsWith('soranominato-')); } catch (e) {}
  return ok ? ['有効：機内モードでも起動できます。', 'ok'] : ['準備中：一度閉じて、もう一度開くと有効になります。', 'late'];
}

}

// ============ 入力 ============

$('#speed').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  speed = +b.dataset.sp; if (speed) lastSpeed = speed;
  for (const x of $('#speed').children) x.classList.toggle('on', x === b);
  requestDraw();
});
document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (!b || S.dayOver) return;
  ({ air: openAir, goal: openGoal, today: openToday, menu: openMenu })[b.dataset.open]();
  updateHud();
});
let toastTimer = 0;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2800);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); }
  else { lastFrame = 0; requestDraw(); }
});
window.addEventListener('resize', () => { layout(); requestDraw(); });
$('#board').addEventListener('click', () => { if (!S.dayOver) openToday(); });
document.querySelector('.zoom').addEventListener('click', e => { const b = e.target.closest('[data-z]'); if (b) zoomAt(VW / 2, VH / 2, cam.n + +b.dataset.z); });
window.addEventListener('pagehide', save);

// ============ 起動 ============
try { lowPower = localStorage.getItem(SAVE_KEY + '-lp') === '1'; } catch (e) {}
if (!load()) newGame();
updateHud(); layout(); requestDraw();
if (S.dayOver) openReport(null);
else if (!S.seenHelp) openHelp();
// 開発中（localhost）は古い版が残らないよう service worker を使わない（?sw を付けると使う）
const DEV = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !location.search.includes('sw');
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !DEV) navigator.serviceWorker.register('sw.js').catch(() => {});

// デバッグ用
window.T = {
  get S() { return S; }, C: () => C, step(n = 60) { for (let i = 0; i < n && !S.dayOver; i++) stepMinute(); requestDraw(); updateHud(); },
  day() { while (!S.dayOver) stepMinute(); updateHud(); }, startDay, build, acceptOffer, upgradeGate, newGame, recalc,
};
